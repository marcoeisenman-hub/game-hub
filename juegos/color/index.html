<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mismo color — Vaina</title><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/estilo.css"><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{background:#fff}main{max-width:760px;margin:90px auto 60px;padding:0 18px;user-select:none;-webkit-user-select:none}h1{font-size:clamp(34px,8vw,58px);letter-spacing:-.05em;margin:0}p{line-height:1.6;color:var(--mut,#666)}button,input{font:inherit}button{touch-action:manipulation}button:disabled{opacity:.5;cursor:default}.panel{border:1px solid var(--line,#ddd);border-radius:16px;padding:20px;margin:24px 0}.meta{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:14px}#status{min-height:50px}table{width:100%;border-collapse:collapse;text-align:left;font-size:14px}td,th{padding:12px 5px;border-bottom:1px solid var(--line,#ddd);overflow-wrap:anywhere}td:first-child{max-width:160px}.bar{height:6px;background:#eee;border-radius:9px;overflow:hidden;margin:8px 0 18px}.bar i{display:block;background:var(--acc);height:100%}#board{margin-top:24px}input[type=range]{width:100%;accent-color:var(--acc)}label{display:block;margin:16px 0}small{color:var(--mut,#666)}@media(max-width:360px){.panel{padding:14px}main{padding:0 12px}}#swatch{height:190px;border-radius:10px}.sample{display:inline-flex;flex-direction:column;gap:5px;margin:8px 12px 8px 0}.sample i{display:block;width:68px;height:48px;border:1px solid #0001;border-radius:5px}output{float:right;font-variant-numeric:tabular-nums}</style></head><body><a class="volver" href="/">← Vaina</a><main><h1>Mismo color</h1><p>¿Cuánto recuerda tu ojo?</p><div class="meta"><span id="round"></span><span>ΔE CIELAB · 0–10 puntos</span></div><section class="panel"><div id="swatch" aria-label="Muestra de color"></div><p id="status" role="status"></p><div id="controls" hidden><label>Tono <output id="hval">180°</output><input id="h" type="range" min="0" max="360" value="180" aria-label="Tono"></label><label>Saturación <output id="sval">50%</output><input id="s" type="range" min="0" max="100" value="50" aria-label="Saturación"></label><label>Brillo <output id="vval">50%</output><input id="v" type="range" min="0" max="100" value="50" aria-label="Brillo"></label></div><button id="submit" class="btn" disabled>Confirmar color</button></section><button id="start" class="btn">Nueva partida</button><div id="board" aria-live="polite"></div><p><small>10 − ΔE76 / 5, con mínimo de 0. Tienes 45 segundos para reconstruirlo. Los colores dependen de tu pantalla.</small></p></main><script>
'use strict';const $=s=>document.querySelector(s);

const APP='vaina-color';let hsb=[180,50,50],sent=false,seed=0;
function rgb([h,s,v]){s/=100;v/=100;const f=n=>{const k=(n+h/60)%6;return Math.round(255*(v-v*s*Math.max(0,Math.min(k,4-k,1))))};return[f(5),f(3),f(1)]}
function paint(c){return 'rgb('+rgb(c).join(',')+')'}
function lab(c){const [r,g,b]=rgb(c).map(n=>{n/=255;return n<=.04045?n/12.92:((n+.055)/1.055)**2.4});const f=n=>n>216/24389?Math.cbrt(n):n*841/108+4/29;const x=f((r*.4124564+g*.3575761+b*.1804375)/.95047),y=f(r*.2126729+g*.7151522+b*.072175),z=f((r*.0193339+g*.119192+b*.9503041)/1.08883);return[116*y-16,500*(x-y),200*(y-z)]}
function delta(a,b){const x=lab(a),y=lab(b);return Math.hypot(...x.map((v,i)=>v-y[i]))}
function points(c,target){return Math.max(0,10-delta(c,target)/5)}
function target(s,n){let t=(s+n*2654435761)>>>0;const rand=()=>{t=(Math.imul(t,1664525)+1013904223)>>>0;return t/4294967296};return[Math.floor(rand()*360),35+Math.floor(rand()*60),40+Math.floor(rand()*55)]}
function start(){if(!host()||game&&!game.closed)return;const continuing=game?.closed&&!game.aborted&&game.round<5&&game.people.some(p=>p.id===me());seed=continuing?game.seed:crypto.getRandomValues(new Uint32Array(1))[0];accept({id:me()+'-'+crypto.randomUUID(),seed,round:continuing?game.round+1:1,people:members(),history:continuing?game.history:[],answers:{},start:clock()+1500,closed:false});publish()}
function enter(){hsb=[180,50,50];sent=false;['h','s','v'].forEach((k,i)=>($('#'+k).value=hsb[i],$('#'+k+'val').textContent=hsb[i]+(i?'%':'°')));$('#board').replaceChildren()}
function reconcile(){if(!game||game.closed)return;const ids=members().map(p=>p.id);for(const p of game.people)if(!ids.includes(p.id)&&!Object.hasOwn(game.answers,p.id))game.answers[p.id]=null;if(clock()>game.start+48000)for(const p of game.people)if(!Object.hasOwn(game.answers,p.id))game.answers[p.id]=null;if(game.people.every(p=>Object.hasOwn(game.answers,p.id))){game.closed=true;game.history.push({target:target(game.seed,game.round),answers:{...game.answers}})}}
function receive(d,de){if(d.type!=='answer'||!host()||!game||game.closed||d.id!==game.id||clock()<game.start+3000||!game.people.some(p=>p.id===de.id)||Object.hasOwn(game.answers,de.id))return;if(!Array.isArray(d.color)||d.color.length!==3||!d.color.every((v,i)=>Number.isFinite(v)&&v>=0&&v<=[360,100,100][i]))return;game.answers[de.id]=d.color;reconcile();publish()}
function submit(){if(!game||sent||clock()<game.start+3000||game.closed||!game.people.some(p=>p.id===me()))return;sent=true;const d={type:'answer',id:game.id,color:[...hsb]};if(host())receive(d,{id:me()});else tx(d);render()}
function swatch(c,label){const box=document.createElement('div');box.className='sample';const square=document.createElement('i');square.style.background=c?paint(c):'#eee';const text=document.createElement('small');text.textContent=label;box.append(square,text);return box}
function renderBoard(){const b=$('#board');b.replaceChildren();if(!game?.closed||game.aborted)return;const real=target(game.seed,game.round);b.append(swatch(real,'Color real'));const table=document.createElement('table');table.innerHTML='<thead><tr><th>Jugador</th><th>Ronda / 10</th><th>Total / 50</th></tr></thead>';const rows=game.people.map(p=>({p,total:game.history.reduce((sum,r)=>sum+(r.answers[p.id]?points(r.answers[p.id],r.target):0),0)})).sort((a,b)=>b.total-a.total);for(const {p,total} of rows){const tr=document.createElement('tr'),name=document.createElement('td'),score=document.createElement('td'),sum=document.createElement('td');name.textContent=p.name;name.append(swatch(game.answers[p.id],game.answers[p.id]?'Reconstrucción':'Sin respuesta'));score.textContent=game.answers[p.id]?points(game.answers[p.id],real).toFixed(1):'0.0';sum.textContent=total.toFixed(1);tr.append(name,score,sum);table.append(tr)}b.append(table)}
function render(){const g=game,elapsed=g?clock()-g.start:0,watch=g&&!g.closed&&elapsed>=0&&elapsed<3000,edit=g&&!g.closed&&elapsed>=3000&&!sent&&g.people.some(p=>p.id===me())&&!Object.hasOwn(g.answers,me());$('#round').textContent=g?'Ronda '+g.round+' de 5':'5 rondas · memoria de color';$('#start').disabled=!host()||!!g&&!g.closed;$('#start').textContent=!host()?'El líder inicia':g?.closed&&!g.aborted&&g.round<5?'Siguiente ronda':'Nueva partida';$('#submit').disabled=!edit;$('#controls').hidden=!edit;$('#swatch').style.background=watch?paint(target(g.seed,g.round)):edit?paint(hsb):'var(--soft,#f4f4f4)';$('#status').textContent=!g?'Mira durante 3 segundos. Después reconstruye el color de memoria.':g.closed?(g.aborted?'Cambió la sala. Inicia una partida nueva.':g.round===5?'Partida terminada.':'Ronda terminada.') :elapsed<0?'Prepárate…':watch?'Memoriza · '+Math.ceil((3000-elapsed)/1000)+' s':edit?'Ajusta y confirma · '+Math.max(0,Math.ceil((48000-elapsed)/1000))+' s':g.people.some(p=>p.id===me())?'Esperando a los demás…':'Entras en la siguiente ronda.';if(g?.closed)renderBoard()}
['h','s','v'].forEach((k,i)=>$('#'+k).oninput=e=>{hsb[i]=+e.target.value;$('#'+k+'val').textContent=hsb[i]+(i?'%':'°');render()});$('#start').onclick=start;$('#submit').onclick=submit;setInterval(()=>{if(online()&&!host()&&sent&&game&&!game.closed&&!Object.hasOwn(game.answers,me()))tx({type:'answer',id:game.id,color:[...hsb]});if(host()&&game&&!game.closed){const before=game.closed;reconcile();if(game.closed!==before)publish()}render()},100);


let sala=null,offset=0,bestRTT=Infinity,pending=new Map(),leaderId='',game=null;
const online=()=>!!sala?.activo,host=()=>!online()||sala.lider(),me=()=>online()?sala.yo.id:'solo';
const clock=()=>Date.now()+offset;
const members=()=>online()?sala.jugadores().map(p=>({id:p.id,name:p.name})):[{id:'solo',name:'Tú'}];
function tx(d){if(online())sala.enviar({...d,app:APP})}
function publish(){tx({type:'state',game});render()}
function accept(g){const changed=!game||game.id!==g.id;game=g;if(changed)enter();render()}
function ping(){if(!online()||host())return;const t=Date.now();pending.set(t,t);tx({type:'ping',t});for(const k of pending.keys())if(t-k>5000)pending.delete(k)}
function conSala(fn){window.RatitoSala?fn(window.RatitoSala):addEventListener('ratitosala',()=>fn(window.RatitoSala),{once:true})}
conSala(api=>{sala=api;sala.al('mensaje',(d,de)=>{if(!d||d.app!==APP)return;const leader=sala.jugadores()[0]?.id;if(d.type==='ping'&&host())tx({type:'pong',to:de.id,t:d.t,now:Date.now()});if(d.type==='pong'&&d.to===me()&&de.id===leader&&pending.has(d.t)){const rtt=Date.now()-d.t;pending.delete(d.t);if(rtt<bestRTT){bestRTT=rtt;offset=d.now-(d.t+rtt/2)}}if(d.type==='hello'&&host()&&game)publish();if(d.type==='state'&&de.id===leader&&d.game)accept(d.game);receive(d,de)});sala.al('cambio',()=>{const lid=online()?sala.jugadores()[0]?.id:'';if(lid!==leaderId){leaderId=lid;offset=0;bestRTT=Infinity;pending.clear();ping();if(game&&!game.closed){game.closed=true;game.aborted=true}}if(host()&&game){reconcile();publish()}else tx({type:'hello'});render()});tx({type:'hello'});render();ping()});
setInterval(ping,1500);

render();
</script><script src="/lib/peerjs.min.js" defer></script><script src="/amigos.js" defer></script></body></html>
