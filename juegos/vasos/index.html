<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vasos — game.hub</title><link rel="icon" href="/favicon.svg?v=3" type="image/svg+xml"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="manifest" href="/manifest.webmanifest"><meta name="apple-mobile-web-app-title" content="game.hub"><link rel="stylesheet" href="/estilo.css"><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{background:#fff;color:#15171C}main{max-width:720px;margin:76px auto 24px;padding:0 16px;user-select:none;-webkit-user-select:none}h1{font-size:clamp(36px,8vw,58px);letter-spacing:-.04em;margin:0}p{line-height:1.5}button{font:inherit;touch-action:none;color:#15171C}#estado{min-height:28px;font-weight:700}.meta{display:flex;justify-content:space-between;font-weight:900;margin:14px 0}#campo{position:relative;border:2px solid #15171C;border-radius:18px;overflow:hidden;touch-action:none}button:focus-visible{outline:4px solid #2D6CDF;outline-offset:2px}#campo{height:290px;background:#FFF5D6}.vaso{position:absolute;top:98px;width:17%;max-width:100px;height:120px;transform:translateX(-50%);border:0;padding:0;background:transparent;transition:left var(--vel,400ms) ease-in-out;cursor:pointer}.vaso:disabled{cursor:default}.vaso svg{position:relative;z-index:1;width:100%;height:100%;overflow:visible;transition:transform .3s}.vaso.arriba svg{transform:translateY(-65px)}.pelota{position:absolute;width:24px;height:24px;border:2px solid #15171C;background:#fff;border-radius:50%;bottom:12px;left:calc(50% - 12px)}.numero{position:absolute;bottom:-30px;left:0;width:100%;font-weight:900}.linea{position:absolute;left:5%;right:5%;top:210px;border-top:2px solid #15171C}</style></head><body><a class="volver" href="/">← game.hub</a><main><h1>Vasos</h1><p>Sigue la pelota, aunque los vasos cambien de lugar. Un fallo termina la partida. Desde la ronda 3 hay fintas: se acercan y vuelven. Desde la ronda 5 hay cuatro vasos; desde la 9, cinco.</p><div id="carrera"></div><div class="meta"><span id="ronda">Ronda 1</span><span id="marca">0 rondas</span></div><div id="campo" aria-label="Mesa de vasos"><div class="linea"></div></div><p id="estado" role="status">Pulsa Empezar. Mira dónde está la pelota.</p></main><script src="/carrera.js"></script><script>
'use strict';
const $=id=>document.getElementById(id),colores=['#2D6CDF','#E63946','#F5B700','#1E9E6A','#6C4BD8'];
let planes=[],ronda=0,superadas=0,vasos=[],orden=[],pelota=0,acepta=false,version=0;
const pausa=ms=>new Promise(r=>setTimeout(r,ms));
function bloquear(){acepta=false;vasos.forEach(b=>b.disabled=true)}
function colocar(){orden.forEach((id,pos)=>{vasos[id].style.left=(pos+.5)*100/orden.length+'%';vasos[id].querySelector('.numero').textContent=pos+1;vasos[id].setAttribute('aria-label','Vaso en posición '+(pos+1))})}
async function siguiente(){const token=++version;bloquear();ronda++;const p=planes[ronda-1];pelota=p.pelota;orden=Array.from({length:p.n},(_,i)=>i);$('campo').innerHTML='<div class="linea"></div>';vasos=[];
 $('ronda').textContent='Ronda '+ronda;
 for(let i=0;i<p.n;i++){const b=document.createElement('button');b.type='button';b.className='vaso arriba';b.disabled=true;b.innerHTML=(i===pelota?'<span class="pelota"></span>':'')+'<svg preserveAspectRatio="none" viewBox="0 0 100 120" aria-hidden="true"><path d="M24 8 H76 L94 112 Q50 122 6 112 Z" fill="#E63946" stroke="#15171C" stroke-width="3"/><path d="M24 8 Q50 0 76 8" fill="none" stroke="#15171C" stroke-width="3"/></svg><span class="numero"></span>';b.addEventListener('pointerdown',e=>{e.preventDefault();if(e.button<=0)elegir(i)});b.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&!e.repeat){e.preventDefault();elegir(i)}});vasos.push(b);$('campo').append(b)}
 colocar();$('estado').textContent='Memoriza la pelota…';await pausa(1100);if(token!==version||!c.jugando)return;vasos.forEach(b=>b.classList.remove('arriba'));await pausa(400);if(token!==version||!c.jugando)return;
 $('estado').textContent='¡Sigue los cambios!';
 for(const [a,b,falso] of p.swaps){vasos.forEach(v=>v.style.setProperty('--vel',(falso?p.vel/2:p.vel)+'ms'));
 if(falso){const va=vasos[orden[a]],vb=vasos[orden[b]],pa=(a+.5)*100/orden.length,pb=(b+.5)*100/orden.length;va.style.left=(pa+(pb-pa)*.42)+'%';vb.style.left=(pb+(pa-pb)*.42)+'%';await pausa(p.vel/2);if(token!==version||!c.jugando)return;colocar();await pausa(p.vel/2+45)}else{[orden[a],orden[b]]=[orden[b],orden[a]];colocar();await pausa(p.vel+45)}if(token!==version||!c.jugando)return}

 acepta=true;vasos.forEach(b=>b.disabled=false);$('estado').textContent='¿Dónde está la pelota? Toca un vaso o pulsa su número (1–5).';
}
document.addEventListener('keydown',e=>{if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||!acepta||e.repeat)return;const pos=Number(e.key)-1;if(pos>=0&&pos<orden.length){e.preventDefault();elegir(orden[pos])}});
function elegir(i){if(!acepta||!c.jugando)return;bloquear();vasos[i].classList.add('arriba');if(i!==pelota){vasos[pelota].classList.add('arriba');finalizar('¡Ese no era! La pelota estaba en el vaso '+(orden.indexOf(pelota)+1)+'.');return}
 superadas++;$('marca').textContent=superadas+(superadas===1?' ronda':' rondas');c.progreso(superadas,15);$('estado').textContent='¡Acertaste!';const token=version;setTimeout(()=>{if(token===version&&c.jugando)siguiente()},700)}
function finalizar(texto){version++;bloquear();if(vasos[pelota])vasos[pelota].classList.add('arriba');$('estado').textContent=texto+' Superaste '+superadas+(superadas===1?' ronda.':' rondas.');c.terminar(superadas)}
const c=Carrera({app:'vasos',maxValor:100,el:$('carrera'),limite:90000,mejor:'alto',formato:v=>v+(v===1?' ronda':' rondas'),
 alEmpezar(rand){version++;ronda=0;superadas=0;$('marca').textContent='0 rondas';planes=Array.from({length:100},(_,i)=>{const n=i>=8?5:i>=4?4:3;return{n,pelota:Math.floor(rand()*n),vel:Math.max(100,360-i*24),swaps:Array.from({length:6+i*2},()=>{const a=Math.floor(rand()*n),b=(a+1+Math.floor(rand()*(n-1)))%n;const falso=rand()<.3&&i>=2;return[a,b,falso]})}});c.progreso(0,15);siguiente()},
 alAcabarTiempo(){finalizar('¡Tiempo!')},alCerrar(){version++;bloquear()}
});

</script><script src="/lib/peerjs.min.js" defer></script><script src="/amigos.js" defer></script></body></html>
