<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Cálculo — game.hub</title><link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="game.hub"><link rel="stylesheet" href="/estilo.css">
<style>
body{background:#fff}
main{max-width:520px;margin:70px auto 40px;padding:0 16px}
h1{font-size:clamp(34px,8vw,54px);letter-spacing:-.05em;margin:0}
.sub{color:var(--mut);margin:2px 0 0}
.pizarra{position:relative;margin-top:14px;border:2px solid var(--ink);border-radius:22px;background:#6C4BD8;color:#fff;padding:22px 16px 18px;text-align:center;overflow:hidden}
.cuenta{font-weight:900;font-size:clamp(44px,13vw,72px);letter-spacing:-.03em;line-height:1.05;font-variant-numeric:tabular-nums}
.resp{margin:12px auto 0;min-height:64px;width:min(240px,80%);border-radius:14px;background:#fff;color:var(--ink);font-weight:900;font-size:44px;line-height:64px;font-variant-numeric:tabular-nums;border:2px solid var(--ink)}
.resp.vacio::after{content:"?";color:#C9CCD3}
.pizarra.bien{animation:bien .35s}
.pizarra.mal .resp{animation:mal .35s;background:#FFD9DC}
@keyframes bien{0%{background:#1E9E6A}100%{background:#6C4BD8}}
@keyframes mal{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.pts{position:absolute;top:12px;right:14px;font-weight:900;font-size:1.2rem;background:#fff;color:var(--ink);border-radius:99px;padding:2px 12px;border:2px solid var(--ink)}
.teclas{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.teclas button{font:900 28px/1 "Schibsted Grotesk",system-ui,sans-serif;padding:16px 0;border-radius:14px;border:2px solid var(--ink);background:#fff;color:var(--ink);box-shadow:0 4px 0 var(--ink);cursor:pointer;touch-action:manipulation}
.teclas button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.teclas button:disabled{opacity:.35;box-shadow:none;transform:none}
.teclas .b{background:#F5B700}
.nota{color:var(--mut);font-size:.9rem}
</style></head><body><a class="volver" href="/">← game.hub</a>
<main>
  <h1>Cálculo</h1><p class="sub">45 segundos. Resuelve todas las que puedas.</p>
  <div id="carrera"></div>
  <section class="pizarra" id="piz"><span class="pts" id="pts">0</span><div class="cuenta" id="op">7 × 8</div><div class="resp vacio" id="resp"></div></section>
  <div class="teclas" id="teclas"></div>
  <p class="nota">Escribe la respuesta: si está bien pasa sola a la siguiente. Puedes usar el teclado. Cada vez se ponen más difíciles.</p>
</main>
<script src="/carrera.js"></script>
<script>
'use strict';
const $=id=>document.getElementById(id);
let rand=Math.random,actual=null,escrito='',puntos=0,n=0,borrarT=0;
const ent=(a,b)=>a+Math.floor(rand()*(b-a+1));
function nueva(){n++;const nivel=Math.min(6,Math.floor(n/4));let a,b,s,r;
  const tipo=nivel<1?ent(0,1):nivel<2?ent(0,2):ent(0,3);
  if(tipo===0){a=ent(2,[9,15,30,50,80,99,150][nivel]);b=ent(2,[9,15,30,50,80,99,150][nivel]);s='+';r=a+b}
  else if(tipo===1){a=ent(3,[12,20,40,60,90,120,200][nivel]);b=ent(1,a-1);s='−';r=a-b}
  else if(tipo===2){a=ent(2,[5,7,9,10,12,13,15][nivel]);b=ent(2,[5,7,9,10,12,13,15][nivel]);s='×';r=a*b}
  else{b=ent(2,[5,7,9,10,12,12,15][nivel]);r=ent(2,[5,7,9,10,12,13,15][nivel]);a=b*r;s='÷'}
  clearTimeout(borrarT);actual={txt:a+' '+s+' '+b,r};$('op').textContent=actual.txt;escrito='';pinta()}
function pinta(){$('resp').textContent=escrito;$('resp').classList.toggle('vacio',!escrito);$('pts').textContent=puntos}
function flash(c){const p=$('piz');p.classList.remove('bien','mal');void p.offsetWidth;p.classList.add(c)}
function tecla(k){if(!c.jugando||!actual)return;
  if(k==='⌫'){escrito=escrito.slice(0,-1);pinta();return}
  if(k==='C'){escrito='';pinta();return}
  if(escrito.length>=4)return;escrito+=k;pinta();
  const meta=String(actual.r);
  if(escrito===meta){puntos++;c.progreso(puntos,30);flash('bien');nueva()}
  else if(escrito.length>=meta.length){flash('mal');clearTimeout(borrarT);const yo=actual;borrarT=setTimeout(()=>{if(actual===yo){escrito='';pinta()}},250)}}
const T=['7','8','9','4','5','6','1','2','3','C','0','⌫'];
$('teclas').innerHTML=T.map(k=>`<button type="button" data-k="${k}" class="${k==='C'||k==='⌫'?'b':''}" aria-label="${k==='⌫'?'Borrar':k==='C'?'Limpiar':k}">${k}</button>`).join('');
$('teclas').addEventListener('pointerdown',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;e.preventDefault();tecla(b.dataset.k)});
addEventListener('keydown',e=>{if(/^[0-9]$/.test(e.key))tecla(e.key);else if(e.key==='Backspace')tecla('⌫')});
function botones(){const on=c.jugando;for(const b of $('teclas').children)b.disabled=!on}
const c=Carrera({app:'calculo',el:$('carrera'),limite:45000,mejor:'alto',formato:v=>v+(v===1?' buena':' buenas'),
  alEmpezar:r=>{rand=r;puntos=0;n=0;nueva();c.progreso(0,30)},
  alAcabarTiempo:()=>{c.terminar(puntos);$('op').textContent='¡Tiempo!';escrito='';pinta()},
  alCerrar:()=>{}});
setInterval(botones,150);botones();
</script>
<script src="/lib/peerjs.min.js" defer></script><script src="/amigos.js" defer></script>
</body></html>
