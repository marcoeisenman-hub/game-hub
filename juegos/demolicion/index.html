<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Demolición — Ratito</title><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/estilo.css"><style>
html,body{height:100%;overflow:hidden;background:#dce5e8}#escena{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}.hud{position:fixed;top:78px;left:20px;right:20px;display:flex;align-items:start;justify-content:space-between;gap:12px;pointer-events:none}.hud h1{font-size:clamp(24px,4vw,40px);letter-spacing:-1.5px;margin:0}.hud p{margin:0;color:#58666a;font-size:13px}.contador{text-align:right;font-size:12px;color:#58666a;white-space:nowrap}.contador strong{display:block;font-size:30px;color:var(--ink);line-height:1.2}.barra{position:fixed;bottom:max(18px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(560px,calc(100% - 28px));padding:12px 16px;background:#fafaf3ed;border:1px solid #ffffff90;border-radius:14px;display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 6px 30px #28362c20}.barra p{font-size:12px;color:var(--mut);margin:0;max-width:280px}.btn{padding:10px 14px;font-size:12px;white-space:nowrap}#estado{position:fixed;top:155px;left:20px;font-size:12px;color:#58666a;max-width:270px}@media(max-width:400px){.barra{padding:12px}.barra p{font-size:11px}.hud{left:14px;right:14px}}
</style></head><body><a class="volver" href="/">← Ratito</a><canvas id="escena" aria-label="Demolición: arrastra la bola hacia atrás y suelta para derribar el edificio"></canvas><div class="hud"><div><h1>Demolición</h1><p>El peso de un buen golpe.</p></div><div class="contador"><strong id="caidos">0 / 0</strong>bloques derribados</div></div><div id="estado" role="status">Cargando la física…</div><div class="barra"><p>Arrastra la bola hacia atrás y suelta. Toca de nuevo para otro disparo.</p><button id="nuevo" class="btn">Nuevo edificio</button></div>
<script src="https://cdn.jsdelivr.net/npm/matter-js@0.19.0/build/matter.min.js"></script><script>
'use strict';
(()=>{const status=document.getElementById('estado');if(!window.Matter){status.textContent='No se pudo cargar la física. Revisa tu conexión y recarga.';return}
const {Engine,Bodies,Body,Composite,Events}=Matter,engine=Engine.create({enableSleeping:true});engine.positionIterations=8;engine.velocityIterations=8;
const canvas=document.getElementById('escena'),ctx=canvas.getContext('2d'),count=document.getElementById('caidos');const W=1100,H=720,ground=584,anchor={x:178,y:ground-65};let scale,ox,oy,blocks=[],ball,particles=[],drag=null,activePointer=null,last=0,acc=0;const materials=[{name:'concreto',density:.0026,fill:'#92948f',edge:'#686d68'},{name:'madera',density:.00075,fill:'#9e7850',edge:'#705538'},{name:'vidrio',density:.00045,fill:'#9cb8bc',edge:'#6e9098'}];
const textures=materials.map((m,k)=>{const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d');g.fillStyle=m.fill;g.fillRect(0,0,64,64);for(let i=0;i<180;i++){g.fillStyle=Math.random()>.5?'#ffffff15':'#171e1715';g.fillRect(Math.random()*64,Math.random()*64,k===1?10+Math.random()*25:1,k===1?.5:1.5)}if(k===2){g.fillStyle='#ffffff24';g.beginPath();g.moveTo(8,0);g.lineTo(35,0);g.lineTo(0,60);g.lineTo(0,16);g.fill()}return ctx.createPattern(c,'repeat')});
function resize(){const dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(innerWidth*dpr);canvas.height=Math.round(innerHeight*dpr);const top=innerHeight<500?105:155,available=Math.max(40,innerHeight-top-110);scale=Math.max(.04,Math.min(innerWidth/W,available/H));ox=(innerWidth-W*scale)/2;oy=top+Math.max(0,(available-H*scale)/2);ctx.setTransform(dpr,0,0,dpr,0,0)}
function projectile(){if(ball)Composite.remove(engine.world,ball);ball=Bodies.circle(anchor.x,anchor.y,19,{density:.028,restitution:.22,friction:.6,label:'bola'});Composite.add(engine.world,ball);Body.setStatic(ball,true);status.textContent='Jala la bola hacia atrás y suelta'}
function building(){Composite.clear(engine.world,false);Engine.clear(engine);particles=[];blocks=[];const floor=Bodies.rectangle(W/2,ground+45,W*3,90,{isStatic:true,friction:.85});Composite.add(engine.world,[floor,Bodies.rectangle(-100,0,80,2000,{isStatic:true}),Bodies.rectangle(W+100,0,80,2000,{isStatic:true})]);const cols=3+Math.floor(Math.random()*4),levels=6+Math.floor(Math.random()*4),bw=48+Math.random()*10,bh=29,left=620-(cols*bw)/2;for(let row=0;row<levels;row++){for(let col=0;col<cols;col++){if(row===levels-1&&(col===0||col===cols-1)&&Math.random()<.35)continue;const k=Math.random()<.28?2:Math.random()<.3?1:0,m=materials[k],x=left+col*(bw+1)+(row%2?3:0),y=ground-bh/2-row*(bh+1);const body=Bodies.rectangle(x,y,bw,bh,{density:m.density,friction:.65,restitution:k===2?.13:.03,frictionStatic:.8,sleepThreshold:90});body.plugin={k,bw,bh,startX:x,startY:y,fallen:false};blocks.push(body)}}Composite.add(engine.world,blocks);projectile();count.textContent=`0 / ${blocks.length}`}
function point(e){return{x:(e.clientX-ox)/scale,y:(e.clientY-oy)/scale}}
canvas.addEventListener('pointerdown',e=>{if(activePointer!==null)return;let p=point(e);if(ball.isStatic&&Math.hypot(p.x-ball.position.x,p.y-ball.position.y)>90)return;if(!ball.isStatic){projectile();return}activePointer=e.pointerId;canvas.setPointerCapture(e.pointerId);drag={...p};Body.setPosition(ball,anchor)});
canvas.addEventListener('pointermove',e=>{if(e.pointerId!==activePointer)return;const p=point(e);let dx=p.x-anchor.x,dy=p.y-anchor.y,len=Math.hypot(dx,dy),limit=122;if(len>limit){dx*=limit/len;dy*=limit/len}drag={x:anchor.x+dx,y:Math.max(ground-120,Math.min(ground-24,anchor.y+dy))};Body.setPosition(ball,drag)});
function release(e,cancel=false){if(e.pointerId!==activePointer)return;activePointer=null;if(cancel){drag=null;Body.setPosition(ball,anchor);return}const p=ball.position;if(Math.hypot(anchor.x-p.x,anchor.y-p.y)*scale<6){drag=null;Body.setPosition(ball,anchor);return}const v={x:(anchor.x-p.x)*.18,y:(anchor.y-p.y)*.18};drag=null;Body.setStatic(ball,false);Matter.Sleeping.set(ball,false);Body.setVelocity(ball,v);status.textContent='Toca el terreno para preparar otra bola.'}canvas.addEventListener('pointerup',e=>release(e));canvas.addEventListener('pointercancel',e=>release(e,true));canvas.addEventListener('lostpointercapture',e=>release(e,true));
Events.on(engine,'collisionStart',event=>{for(const pair of event.pairs){const a=pair.bodyA,b=pair.bodyB,speed=Math.hypot(a.velocity.x-b.velocity.x,a.velocity.y-b.velocity.y);if(speed<2.8||particles.length>260)continue;const pos=pair.collision.supports[0]||a.position;for(let i=0;i<Math.min(18,speed*2);i++)particles.push({x:pos.x,y:pos.y,vx:(Math.random()-.5)*speed,vy:-Math.random()*speed*.6,life:1,r:2+Math.random()*5,dust:i%3!==0})}});
function drawBody(b){const p=b.plugin;ctx.save();ctx.translate(b.position.x,b.position.y);ctx.rotate(b.angle);ctx.shadowColor='#35403330';ctx.shadowBlur=5;ctx.shadowOffsetY=3;ctx.fillStyle=textures[p.k];ctx.fillRect(-p.bw/2,-p.bh/2,p.bw,p.bh);ctx.shadowColor='transparent';ctx.strokeStyle=materials[p.k].edge;ctx.lineWidth=.9;ctx.strokeRect(-p.bw/2+.5,-p.bh/2+.5,p.bw-1,p.bh-1);ctx.strokeStyle='#ffffff40';ctx.beginPath();ctx.moveTo(-p.bw/2+1,p.bh/2-1);ctx.lineTo(-p.bw/2+1,-p.bh/2+1);ctx.lineTo(p.bw/2-1,-p.bh/2+1);ctx.stroke();ctx.restore()}
function render(t){if(!last)last=t;acc+=Math.min(t-last,50);last=t;while(acc>=1000/60){Engine.update(engine,1000/60);for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.vy+=p.dust?-.012:.12;p.vx*=.98;p.life-=p.dust?.014:.025}particles=particles.filter(p=>p.life>0);acc-=1000/60}
const sw=innerWidth,sh=innerHeight;let sky=ctx.createLinearGradient(0,0,0,sh);sky.addColorStop(0,'#c6d8df');sky.addColorStop(.8,'#eff0e5');ctx.fillStyle=sky;ctx.fillRect(0,0,sw,sh);ctx.save();ctx.translate(ox,oy);ctx.scale(scale,scale);
ctx.fillStyle='#b1b9a5';ctx.beginPath();ctx.moveTo(-3000,ground);for(let x=-3000;x<=W+3000;x+=30)ctx.lineTo(x,ground-35-Math.sin(x*.008)*14-Math.cos(x*.021)*5);ctx.lineTo(W+3000,H+3000);ctx.lineTo(-3000,H+3000);ctx.fill();let soil=ctx.createLinearGradient(0,ground,0,H+400);soil.addColorStop(0,'#a89a7f');soil.addColorStop(.1,'#8b7a60');soil.addColorStop(1,'#6d614f');ctx.fillStyle=soil;ctx.fillRect(-3000,ground,W+6000,H+3000);ctx.strokeStyle='#e4ddc480';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-3000,ground);ctx.lineTo(W+3000,ground);ctx.stroke();ctx.fillStyle='#493f3028';for(let i=0;i<250;i++){const x=(i*139.7)%1500-200,y=ground+5+(i*47.13)%280;ctx.fillRect(x,y,2+(i%4),1)}
ctx.strokeStyle='#655849';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(anchor.x-12,ground);ctx.lineTo(anchor.x,anchor.y);ctx.lineTo(anchor.x+12,ground);ctx.stroke();if(drag||ball.isStatic){ctx.strokeStyle='#463e33';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(anchor.x,anchor.y+5);ctx.lineTo(ball.position.x,ball.position.y);ctx.stroke();if(drag){const vx=(anchor.x-ball.position.x)*.18,vy=(anchor.y-ball.position.y)*.18;ctx.fillStyle='#ffffffa0';for(let n=1;n<18;n++){const t=n*3,x=ball.position.x+vx*t,y=ball.position.y+vy*t+engine.gravity.y*engine.gravity.scale*(1000/60)**2*t*t/2;if(y>ground)break;ctx.beginPath();ctx.arc(x,y,1.8,0,Math.PI*2);ctx.fill()}}}
for(const b of blocks){drawBody(b);const p=b.plugin;if(!p.fallen&&(Math.abs(b.position.x-p.startX)>p.bw*.85||b.position.y>p.startY+p.bh*.8||Math.abs(b.angle)>.65))p.fallen=true}const fallen=blocks.filter(b=>b.plugin.fallen).length;count.textContent=`${fallen} / ${blocks.length}`;if(fallen===blocks.length&&blocks.length)status.textContent='Edificio derribado. ¿Vamos con otro?';ctx.save();ctx.translate(ball.position.x,ball.position.y);const g=ctx.createRadialGradient(-6,-8,1,0,0,20);g.addColorStop(0,'#9ba3a5');g.addColorStop(.45,'#4b555a');g.addColorStop(1,'#20272b');ctx.fillStyle=g;ctx.shadowColor='#0004';ctx.shadowBlur=7;ctx.beginPath();ctx.arc(0,0,19,0,Math.PI*2);ctx.fill();ctx.restore();for(const p of particles){ctx.globalAlpha=p.life*(p.dust?.33:.8);ctx.fillStyle=p.dust?'#c4baa3':'#787569';ctx.beginPath();ctx.arc(p.x,p.y,p.r*(p.dust?2-p.life:1),0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;ctx.restore();requestAnimationFrame(render)}
document.getElementById('nuevo').onclick=()=>{activePointer=null;drag=null;building()};addEventListener('resize',resize);resize();building();requestAnimationFrame(render);
})();
</script><script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js" defer></script><script src="/amigos.js" defer></script></body></html>
