<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reflejos — game.hub</title><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/estilo.css"><style>
main{max-width:800px;margin:90px auto 30px;padding:0 20px}h1{font-size:clamp(32px,7vw,52px);letter-spacing:-.05em;margin:0}header p{color:var(--mut);margin:8px 0 24px}.tabs{display:flex;gap:8px;margin-bottom:20px}.tabs button{flex:1;font-size:14px;padding:12px 8px}.tabs [aria-selected=true]{background:var(--ink);color:white}.pad{display:flex;align-items:center;justify-content:center;flex-direction:column;width:100%;min-height:310px;padding:26px 18px;border:1px solid var(--line);border-radius:18px;background:var(--soft);color:var(--ink);font:inherit;cursor:pointer;touch-action:manipulation;text-align:center;user-select:none}.pad strong{font-size:clamp(25px,6vw,42px);font-weight:500;letter-spacing:-.04em}.pad span{margin-top:12px;font-size:14px}.pad.wait{background:#eee3d6;border-color:#d7c5b0}.pad.go{background:#2f624c;color:white;border-color:#2f624c}.pad.running{background:#20282e;color:#fff}.pad small{font-size:13px;margin-top:16px;color:inherit}.stats{display:flex;justify-content:space-between;gap:18px;color:var(--mut);font-size:13px;margin:18px 0}.result{min-height:52px;margin:18px 0;font-size:16px}#attempts{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0;padding:0;list-style:none}#attempts li{background:var(--soft);padding:7px 12px;border-radius:7px;font-size:13px}.foot{font-size:12px;color:var(--mut);margin-top:24px}#reset{padding:9px 14px;font-size:13px}@media(max-width:400px){main{padding:0 14px}.pad{min-height:300px}.stats{font-size:12px}}
</style></head><body><a class="volver" href="/">← game.hub</a><main><header><h1>Reflejos</h1><p>Una prueba de velocidad. Otra de tu reloj interior.</p></header><div class="tabs" role="tablist" aria-label="Modo de juego"><button class="btn sec" role="tab" id="reaction" aria-selected="true" aria-controls="game">Tiempo de reacción</button><button class="btn sec" role="tab" id="clock" aria-selected="false" aria-controls="game">Para en 10 segundos</button></div><section id="game"><button class="pad" id="pad"><strong id="headline"></strong><span id="hint"></span><small id="detail"></small></button><div class="stats"><span id="progress"></span><span id="best"></span></div><ol id="attempts" aria-label="Intentos completados"></ol><p class="result" id="result" role="status" aria-live="polite"></p><button class="btn sec" id="reset">Reiniciar</button><p class="foot" id="foot"></p></section></main>
<script>
'use strict';
const $=s=>document.querySelector(s),pad=$('#pad');let mode='reaction',state='idle',timer=0,raf=0,start=0,scores=[],round=0;
function read(key){try{const raw=localStorage.getItem('ratito-'+key);if(raw===null)return null;const n=Number(raw);return Number.isFinite(n)&&n>=0?n:null;}catch{return null;}}
function record(key,n){const best=read(key);if(best===null||n<best){try{localStorage.setItem('ratito-'+key,String(n));}catch{}}}
function show(title,hint='',detail='',cls=''){ $('#headline').textContent=title;$('#hint').textContent=hint;$('#detail').textContent=detail;pad.className='pad '+cls;}
function stats(){const b=read(mode);$('#best').textContent=b===null?'Sin marca todavía':mode==='reaction'?'Mejor promedio: '+Math.round(b)+' ms':'Menor diferencia: '+(b/1000).toFixed(3)+' s';$('#progress').textContent=mode==='reaction'?scores.length+' / 5 intentos':'Objetivo: 10.000 s';}
function cancel(){clearTimeout(timer);cancelAnimationFrame(raf);round++;}
function reset(){cancel();state='idle';scores=[];$('#result').textContent='';$('#attempts').replaceChildren();show(mode==='reaction'?'¿Qué tan rápido eres?':'Cuenta hasta diez',mode==='reaction'?'Toca para empezar una ronda de 5 intentos.':'Toca para iniciar el cronómetro.','También puedes usar la barra espaciadora.');$('#foot').textContent=mode==='reaction'?'Espera al verde. Como referencia aproximada, una reacción visual suele rondar los 250 ms; el dispositivo también influye.':'El reloj se oculta tras 3 segundos. Deténlo lo más cerca posible de 10.000 s.';stats();}
function activate(){if(conectado()&&carrera){tocarCarrera();return}const now=performance.now();if(mode==='clock'){if(state==='running'){const elapsed=now-start,diff=Math.abs(elapsed-10000);cancelAnimationFrame(raf);state='done';record('clock',diff);show((elapsed/1000).toFixed(3)+' s','Diferencia: '+(diff/1000).toFixed(3)+' s',elapsed<10000?'Te adelantaste. Toca para repetir.':elapsed>10000?'Te pasaste. Toca para repetir.':'¡Exacto! Toca para repetir.');$('#result').textContent=diff<100?'Un reloj interior muy preciso.':diff<500?'Muy cerca del objetivo.':'Vuelve a probar y ajusta tu cuenta.';stats();}else{state='running';start=now;$('#result').textContent='';function update(){if(state!=='running')return;const t=performance.now()-start;show(t<3000?(t/1000).toFixed(3)+' s':'···',t<3000?'El reloj se ocultará a los 3 segundos.':'Confía en tu cuenta.','Toca o pulsa espacio para parar.','running');if(t<3000)raf=requestAnimationFrame(update);}update();}return;}
if(state==='waiting'){cancel();state='early';show('Demasiado pronto','Espera a que la pantalla se vuelva verde.','Toca para repetir este intento.');$('#result').textContent='Este intento no cuenta.';return;}
if(state==='ready'){const ms=now-start;scores.push(ms);const li=document.createElement('li');li.textContent=scores.length+'. '+Math.round(ms)+' ms';$('#attempts').append(li);if(scores.length===5){const avg=scores.reduce((a,b)=>a+b,0)/5;record('reaction',avg);state='done';show(Math.round(avg)+' ms de promedio','Completaste los 5 intentos.','Toca para empezar otra ronda.');$('#result').textContent=avg<250?'Tu promedio fue '+Math.round(250-avg)+' ms más rápido que la referencia de 250 ms.': 'Tu promedio fue '+Math.round(avg-250)+' ms por encima de la referencia de 250 ms.';}else{state='between';show(Math.round(ms)+' ms','Intento '+scores.length+' de 5 completado.','Toca para el siguiente.');$('#result').textContent='';}stats();return;}
if(state==='done'){scores=[];$('#attempts').replaceChildren();stats();}state='waiting';$('#result').textContent='';show('Espera…','Todavía no.','Toca solo cuando veas el verde.','wait');const token=++round;timer=setTimeout(()=>{if(token!==round||document.hidden)return;raf=requestAnimationFrame(()=>{if(token!==round||document.hidden)return;state='ready';show('¡Ahora!','Toca o pulsa espacio.','','go');start=performance.now();});},1600+Math.random()*2600);}
pad.addEventListener('pointerdown',e=>{if(e.button!==0)return;e.preventDefault();pad.focus({preventScroll:true});activate();});
pad.addEventListener('click',e=>{if(e.detail===0)activate();});
document.addEventListener('keydown',e=>{if(e.code!=='Space'||e.repeat||e.altKey||e.ctrlKey||e.metaKey)return;if(e.target.closest('button')&&e.target!==pad)return;e.preventDefault();activate();});
for(const id of ['reaction','clock'])$('#'+id).onclick=()=>{if(conectado()&&carrera&&!carrera.cerrada)return;carrera=null;tablaCarrera();mode=id;avisar();for(const other of ['reaction','clock'])$('#'+other).setAttribute('aria-selected',id===other);reset();pad.focus({preventScroll:true});};
$('#reset').onclick=()=>{if(conectado()&&carrera&&!carrera.cerrada)return;carrera=null;tablaCarrera();avisar();reset();pad.focus({preventScroll:true});};
document.addEventListener('visibilitychange',()=>{if(!carrera&&document.hidden&&(state==='waiting'||state==='ready'||state==='running')){if(mode==='reaction'){cancel();state='between';show('Intento en pausa','Toca para repetir este intento.');}else reset();$('#result').textContent='Pausa al cambiar de pestaña. Continúa cuando estés listo.';}});
let sala=null,carrera=null,offset=0,pings=new Map(),mejorPing=Infinity,enviado=false;
const raceButton=document.createElement('button');raceButton.className='btn';raceButton.textContent='Carrera con amigos';raceButton.hidden=true;$('#reset').after(raceButton);
const juntos=document.createElement('p');juntos.style.cssText='font-size:12px;color:var(--mut);overflow-wrap:anywhere';$('header').append(juntos);
const tabla=document.createElement('div');tabla.setAttribute('aria-live','polite');tabla.style.cssText='font-size:13px;overflow:auto;margin-top:16px';raceButton.after(tabla);
function conectado(){return sala&&sala.activo}
function reloj(){return Date.now()+offset}
function esLider(de){return de.id===sala.jugadores()[0]?.id}
function avisar(){juntos.textContent=conectado()?'Jugando con: '+sala.jugadores().filter(p=>!p.yo).map(p=>p.name).join(', '):'';raceButton.hidden=!conectado();raceButton.disabled=conectado()&&(!sala.lider()||!!(carrera&&!carrera.cerrada));raceButton.textContent=carrera&&carrera.n<5?'Siguiente ronda ('+(carrera.n+1)+'/5)':'Carrera con amigos';if(carrera&&!carrera.cerrada)raceButton.textContent='Carrera en curso';if(conectado()&&!sala.lider())raceButton.textContent='El líder inicia la carrera';}
function escapar(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function tablaCarrera(){if(!carrera){tabla.innerHTML='';return}const completas=carrera.historial;const filas=carrera.personas.map(p=>{const vals=completas.map(r=>r[p.id]??null),total=vals.reduce((a,v)=>a+(v===null?60000:v),0);return {p,vals,total}}).sort((a,b)=>a.total-b.total);tabla.innerHTML='<p>Ronda '+carrera.n+' de 5 · '+(carrera.mode==='clock'?'menor diferencia con 10.000 s':'menor tiempo')+'</p><table style="width:100%;text-align:left;border-collapse:collapse"><thead><tr><th>Jugador</th><th>Rondas (ms)</th><th>Acumulado</th></tr></thead><tbody>'+filas.map(f=>'<tr><td style="padding:5px 3px">'+escapar(f.p.name)+'</td><td>'+f.vals.map(v=>v===null?'—':Math.round(v)).join(' / ')+'</td><td>'+Math.round(f.total)+' ms</td></tr>').join('')+'</tbody></table>'+completas.map((r,i)=>{const validos=carrera.personas.filter(p=>Number.isFinite(r[p.id])).sort((a,b)=>r[a.id]-r[b.id]);const ganadores=validos.filter(p=>r[p.id]===r[validos[0]?.id]);return '<p>Ronda '+(i+1)+': '+(ganadores.length?'🏁 '+ganadores.map(p=>escapar(p.name)).join(' y '):'sin ganador')+'</p>'}).join('')+(completas.length===5?'<p><strong>Ganador de la carrera: '+filas.filter(f=>f.total===filas[0].total).map(f=>escapar(f.p.name)).join(' y ')+'</strong></p>':'');}
function enviarCarrera(){sala.enviar({tipo:'carrera',carrera})}
function prepararCarrera(c){cancel();carrera=c;mode=c.mode;enviado=Object.hasOwn(c.resultados,sala.yo.id);for(const id of ['reaction','clock'])$('#'+id).setAttribute('aria-selected',mode===id);tablaCarrera();avisar();$('#progress').textContent='Carrera · '+c.n+' / 5';if(c.cerrada){state='raceDone';show(c.n===5?'Carrera terminada':'Ronda terminada',sala.lider()?'Pulsa Siguiente ronda para continuar.':'Espera a que el líder continúe.');return}state='race';const token=round;function pintar(){if(token!==round||!carrera||carrera.id!==c.id)return;const now=reloj(),inicio=c.inicio,verde=inicio+c.retraso;if(enviado){show('Tiempo enviado','Esperando a los demás…');return}if(now<inicio)show('Preparados…',String(Math.ceil((inicio-now)/1000)),'Ronda '+c.n+' de 5','wait');else if(mode==='reaction'){if(now<verde)show('Espera…','Toca solo cuando veas el verde.','','wait');else show('¡Ahora!','Toca o pulsa espacio.','','go')}else{const elapsed=now-inicio;show(elapsed<3000?(elapsed/1000).toFixed(3)+' s':'···','Confía en tu cuenta.','Toca o pulsa espacio para parar.','running')}raf=requestAnimationFrame(pintar)}pintar();}
function iniciarCarrera(){if(!conectado()||!sala.lider())return;if(carrera&&!carrera.cerrada)return;const continuar=carrera&&carrera.n<5&&carrera.mode===mode;const c={id:sala.yo.id+'-'+Date.now(),mode,n:continuar?carrera.n+1:1,inicio:Date.now()+2400,retraso:mode==='reaction'?1600+Math.random()*2600:0,personas:continuar?[...carrera.personas,...sala.jugadores().filter(j=>!carrera.personas.some(p=>p.id===j.id)).map(p=>({id:p.id,name:p.name}))]:sala.jugadores().map(p=>({id:p.id,name:p.name})),historial:continuar?carrera.historial:[],resultados:{},cerrada:false};offset=0;prepararCarrera(c);enviarCarrera()}
function resultadoCarrera(d,de){if(!sala.lider()||!carrera||carrera.cerrada||d.id!==carrera.id||!carrera.personas.some(p=>p.id===de.id)||Object.hasOwn(carrera.resultados,de.id))return;if(d.valor!==null&&(!Number.isFinite(d.valor)||d.valor<0||d.valor>60000))return;carrera.resultados[de.id]=d.valor;cerrarSiListos();}
function cerrarSiListos(){if(!carrera||carrera.cerrada)return;const presentes=sala.jugadores().map(p=>p.id);for(const p of carrera.personas)if(!presentes.includes(p.id))carrera.resultados[p.id]=null;const plazo=carrera.inicio+carrera.retraso+30000;if(Date.now()>plazo)for(const p of carrera.personas)if(!Object.hasOwn(carrera.resultados,p.id))carrera.resultados[p.id]=null;if(carrera.personas.every(p=>Object.hasOwn(carrera.resultados,p.id))){carrera.cerrada=true;carrera.historial.push({...carrera.resultados});prepararCarrera(carrera)}enviarCarrera();}
function tocarCarrera(){if(!carrera||carrera.cerrada||enviado)return;const now=reloj();if(now<carrera.inicio)return;const elapsed=now-carrera.inicio-carrera.retraso,valor=mode==='reaction'?(elapsed<0?null:elapsed):Math.abs(elapsed-10000);enviado=true;cancelAnimationFrame(raf);show(valor===null?'Demasiado pronto':Math.round(valor)+' ms',mode==='clock'?'Diferencia con 10.000 s':'Tiempo enviado','Esperando a los demás…');const d={tipo:'tiempo',id:carrera.id,valor};if(sala.lider())resultadoCarrera(d,sala.yo);else sala.enviar(d);}
raceButton.onclick=iniciarCarrera;
function conSala(fn){window.RatitoSala?fn(window.RatitoSala):addEventListener('ratitosala',()=>fn(window.RatitoSala),{once:true})}
conSala(api=>{sala=api;let liderAnterior='';function ping(){if(!conectado()||sala.lider())return;const t=Date.now();pings.set(t,t);sala.enviar({tipo:'ping',t});setTimeout(()=>pings.delete(t),5000)}function cambio(){const lid=conectado()?sala.jugadores()[0]?.id:'';if(liderAnterior===sala.yo.id&&lid&&lid!==liderAnterior&&carrera)sala.enviar({tipo:'traspasoCarrera',para:lid,carrera});if(lid!==liderAnterior){liderAnterior=lid;mejorPing=Infinity;if(sala.lider()){if(carrera&&!carrera.cerrada){carrera.cerrada=true;carrera.historial.push({...carrera.resultados});prepararCarrera(carrera)}offset=0}else ping()}avisar();if(!conectado()){carrera=null;cancel();tablaCarrera();reset()}else if(sala.lider()&&carrera){if(!carrera.cerrada)cerrarSiListos();else enviarCarrera()}}sala.al('cambio',cambio);sala.al('mensaje',(d,de)=>{if(!d)return;if(d.tipo==='traspasoCarrera'&&d.para===sala.yo.id&&sala.lider()&&d.carrera){const c=d.carrera;if(!c.cerrada){c.cerrada=true;c.historial.push({...c.resultados})}prepararCarrera(c);enviarCarrera()}if(d.tipo==='ping'&&sala.lider())sala.enviar({tipo:'pong',para:de.id,t:d.t,ahora:Date.now()});if(d.tipo==='pong'&&d.para===sala.yo.id&&esLider(de)&&pings.has(d.t)){const rtt=Date.now()-d.t;pings.delete(d.t);if(rtt<mejorPing){mejorPing=rtt;offset=d.ahora-(d.t+rtt/2)}}if(d.tipo==='carrera'&&esLider(de)&&d.carrera){const c=d.carrera;if(!carrera||c.id!==carrera.id||c.cerrada!==carrera.cerrada)prepararCarrera(c);else{carrera=c;tablaCarrera()}if(!c.personas.some(p=>p.id===sala.yo.id)){enviado=true;show('Ronda en curso','Entras desde la próxima ronda.')}}if(d.tipo==='tiempo')resultadoCarrera(d,de)});setInterval(ping,2000);setInterval(()=>{if(conectado()&&sala.lider()&&carrera&&!carrera.cerrada&&Date.now()>carrera.inicio+carrera.retraso+30000)cerrarSiListos()},1000);cambio()});

reset();
</script><script src="/lib/peerjs.min.js" defer></script>
<script src="/amigos.js" defer></script>
</body></html>
