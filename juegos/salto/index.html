<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Salto — game.hub</title><link rel="icon" href="/favicon.svg?v=3"><link rel="stylesheet" href="/estilo.css"><style>*{box-sizing:border-box}main{max-width:640px;margin:76px auto 24px;padding:0 16px;user-select:none}h1{font-size:48px;letter-spacing:-.04em;margin:0}p{line-height:1.5}canvas{display:block;width:100%;height:min(58svh,600px);min-height:300px;border:3px solid #15171C;border-radius:16px;touch-action:none;background:#FFF5D6}.meta{display:flex;justify-content:space-between;font-weight:900;margin:12px 0}#marca{font-size:25px}button{touch-action:manipulation}</style></head><body><a class="volver" href="/">← game.hub</a><main><h1>Salto</h1><p>Rebota hasta lo más alto antes de que te alcance la lava. Domina los resortes, evita los pinchos y cruza los bordes. En sala ves a tus amigos saltando contigo.</p><div id="carrera"></div><div class="meta"><span id="marca">0</span><span id="fase">A-D / flechas / mantén izquierda o derecha</span></div><canvas id="campo" aria-label="Salto: área de juego" tabindex="0"></canvas><p id="estado" role="status">Pulsa Empezar. A-D / flechas / mantén izquierda o derecha</p></main><script src="/carrera.js"></script><script>
 'use strict';
const canvas=document.querySelector('#campo'),g=canvas.getContext('2d'),marca=document.querySelector('#marca'),estado=document.querySelector('#estado'),fase=document.querySelector('#fase');
const W=480,H=600,keys=new Set();let active=false,frame=0,last=0,acc=0,t=0,shake=0,parts=[];
function resize(){const r=canvas.getBoundingClientRect(),d=devicePixelRatio||1;canvas.width=Math.round(r.width*d);canvas.height=Math.round(r.height*d);draw()}
function circle(x,y,r,color){g.fillStyle=color;g.strokeStyle='#15171C';g.lineWidth=2;g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fill();g.stroke()}
function rect(x,y,w,h,color){g.fillStyle=color;g.strokeStyle='#15171C';g.lineWidth=2;g.fillRect(x,y,w,h);g.strokeRect(x,y,w,h)}
function burst(x,y,color,n=22){shake=10;for(let i=0;i<n;i++){const a=i*2.399963;parts.push({x,y,vx:Math.cos(a)*(70+i*5),vy:Math.sin(a)*(70+i*5),life:.65,color})}}
function effects(dt){shake=Math.max(0,shake-dt*22);for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt}parts=parts.filter(p=>p.life>0)}
function backdrop(){g.setTransform(canvas.width/W,0,0,canvas.height/H,0,0);g.clearRect(0,0,W,H);g.fillStyle='#FFF5D6';g.fillRect(0,0,W,H);g.translate(Math.sin(t*97)*shake,Math.cos(t*113)*shake)}
function sparks(){for(const p of parts){g.globalAlpha=Math.max(0,p.life/.65);rect(p.x,p.y,5,5,p.color)}g.globalAlpha=1}
function loop(now){const dt=Math.min(.1,Math.max(0,(now-last)/1000));last=now;acc+=dt;while(acc>=1/120){if(active)update(1/120);effects(1/120);acc-=1/120}if(!active&&sala&&sala.activo){let best=null;const ah=performance.now();for(const id in fant){const f=fant[id];if(!f.muerto&&ah-f.t<1500&&(!best||f.y<best.y))best=f}if(best)camera+=((best.y-230)-camera)*Math.min(1,dt*4)}
 draw();if(active||parts.length||(sala&&sala.activo))frame=requestAnimationFrame(loop);else frame=0}
function begin(){cancelAnimationFrame(frame);active=true;t=0;parts=[];shake=0;acc=0;keys.clear();last=performance.now();canvas.focus({preventScroll:true});frame=requestAnimationFrame(loop)}
addEventListener('keydown',e=>{if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;const k=e.key.toLowerCase();if(['arrowleft','arrowright','arrowup','arrowdown','w','a','s','d'].includes(k)&&active){e.preventDefault();keys.add(k)}});
addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));addEventListener('blur',()=>{keys.clear();release()});
canvas.addEventListener('pointercancel',release);canvas.addEventListener('pointerup',release);canvas.addEventListener('lostpointercapture',release);addEventListener('resize',resize);

let lava=700,fant={},ultFant=0,player={x:240,y:525,vx:0,vy:-650},platforms=[],camera=0,height=0,direction=0,report=0;
function release(){direction=0}
function steer(e){direction=e.clientX<canvas.getBoundingClientRect().left+canvas.getBoundingClientRect().width/2?-1:1}
canvas.addEventListener('pointerdown',e=>{if(!active||e.button>0)return;e.preventDefault();steer(e);canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(active&&canvas.hasPointerCapture(e.pointerId))steer(e)});
function finish(){if(!active)return;active=false;if(sala&&sala.activo)sala.enviar({app:'salto-fant',x:Math.round(player.x),y:Math.round(player.y),h:height,muerto:1});release();burst(player.x,Math.min(H-20,player.y-camera),'#E63946',35);marca.textContent=height+' m';estado.textContent='Fin de la escalada. Llegaste a '+height+' m.'+(sala&&sala.activo?' Mira a tus amigos…':'');c.progreso(height,1500);c.terminar(height)}
function update(dt){t+=dt;const d=(keys.has('arrowright')||keys.has('d')?1:0)-(keys.has('arrowleft')||keys.has('a')?1:0)||direction;player.vx+=(d*310-player.vx)*(1-Math.exp(-13*dt));player.x=((player.x+player.vx*dt)%W+W)%W;const oldY=player.y;player.vy+=1450*dt;player.y+=player.vy*dt;
 for(const p of platforms){if(p.type===1)p.x=p.base+Math.sin(t*p.speed+p.phase)*p.range;if(p.crumble>0){p.crumble-=dt;if(p.crumble<=0)p.dead=true}if(p.type===3)p.visible=Math.sin(t*1.5+p.phase)>.05;else p.visible=true;
 if(p.dead||!p.visible)continue;const distance=Math.min(Math.abs(player.x-p.x),W-Math.abs(player.x-p.x));
 if(p.type===5&&distance<p.w/2+9&&Math.abs(player.y-p.y)<24){finish();return}
 if(p.type!==5&&player.vy>0&&oldY+13<=p.y&&player.y+13>=p.y&&distance<p.w/2+9){player.y=p.y-13;player.vy=p.type===4?-950:-650;if(p.type===2)p.crumble=.14;burst(player.x,player.y-camera,p.type===4?'#F5B700':'#2D6CDF',8);shake=p.type===4?8:2}}
 // la lava sube cada vez más rápido y no se queda muy lejos
 lava-=Math.min(230,38+t*2.4)*dt;if(lava>camera+H+90)lava=camera+H+90;
 if(player.y+13>=lava){burst(player.x,player.y-camera,'#F28C28',40);finish();return}
 camera=Math.min(camera,player.y-230);height=Math.max(height,Math.floor((525-player.y)/10));if(player.y-camera>H+35){finish();return}if(sala&&sala.activo&&t-ultFant>.08){ultFant=t;sala.enviar({app:'salto-fant',x:Math.round(player.x),y:Math.round(player.y),h:height})}
 if(t-report>.15){report=t;marca.textContent=height+' m';fase.textContent='🔥 lava a '+Math.max(0,Math.floor((lava-player.y)/10))+' m';c.progreso(height,1500)}
}
function draw(){backdrop();g.strokeStyle='#ecdba9';g.lineWidth=1;for(let y=(-camera)%60;y<H;y+=60){g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke()}
 for(const source of platforms)for(const offset of [-W,0,W]){const p={...source,x:source.x+offset};const y=p.y-camera;if(y<-40||y>H+40||p.dead)continue;g.globalAlpha=p.visible?1:.14;const colors=['#1E9E6A','#2D6CDF','#E4572E','#6C4BD8','#F5B700','#E63946'];rect(p.x-p.w/2,y,p.w,12,colors[p.type]);g.fillStyle='#15171C';g.font='bold 15px sans-serif';g.textAlign='center';if(p.type===5){for(let x=p.x-p.w/2;x<p.x+p.w/2;x+=14){g.beginPath();g.moveTo(x,y);g.lineTo(x+7,y-15);g.lineTo(x+14,y);g.fill()}}else if(p.type===4)g.fillText('↑↑',p.x,y-6);else if(p.type===2)g.fillText('╱╲',p.x,y+11);else if(p.type===3)g.fillText('···',p.x,y+9)}g.globalAlpha=1;
 const ahora=performance.now();for(const id in fant){const f=fant[id];if(ahora-f.t>3000)continue;const y=f.y-camera;if(y<-40||y>H+40)continue;g.globalAlpha=f.muerto?.25:.55;rect(f.x-11,y-13,22,26,f.color);g.globalAlpha=1;g.fillStyle='#15171C';g.font='bold 12px sans-serif';g.textAlign='center';g.fillText(f.name,f.x,y-20)}
 {const ly=lava-camera;if(ly<H){g.fillStyle='#E8501C';g.beginPath();g.moveTo(0,H+20);for(let x=0;x<=W;x+=20)g.lineTo(x,ly+Math.sin(x*.05+t*4)*6);g.lineTo(W,H+20);g.closePath();g.fill();g.strokeStyle='#15171C';g.lineWidth=3;g.stroke();
   g.fillStyle='#F5B700';for(let i=0;i<7;i++){const bx=(i*83+t*30)%W,by=ly+18+((i*37+t*40)%60);if(by<H)g.fillRect(bx,by,7,7)}
   if(ly<H&&ly>H-160&&active){g.fillStyle='#E63946';g.font='900 16px sans-serif';g.textAlign='center';g.fillText('¡LA LAVA SUBE!',W/2,Math.max(30,ly-14))}}}
 if(active||!t){for(const x of [player.x,player.x-W,player.x+W]){rect(x-11,player.y-camera-13,22,26,'#F28C28');rect(x+2,player.y-camera-7,5,5,'#fff')}}sparks()}
const c=Carrera({app:'salto',maxValor:200000,sinReloj:true,el:document.querySelector('#carrera'),limite:3600000,mejor:'alto',formato:v=>v+' m',vivo:v=>v+' m',alEmpezar(rand){platforms=[{x:240,base:240,y:550,w:160,type:0,visible:true}];let y=550,x=240;
 // Cada altura garantiza una ruta alcanzable; trampas adicionales nunca reemplazan esa ruta.
 for(let i=1;i<650;i++){const difficulty=Math.min(1,i/110);y-=72+rand()*(38+32*difficulty);x=Math.max(55,Math.min(W-55,x+(rand()-.5)*(180+70*difficulty)));const roll=rand();let type=i<5?0:roll<.19?1:roll<.39?2:roll<.53?3:roll<.64?4:0;if(i%7===0)type=0;const w=102-difficulty*35;platforms.push({base:x,x,y,w,type,phase:rand()*6.28,speed:.7+rand(),range:24+rand()*18,visible:true,dead:false,crumble:0});
 if(type===3)platforms.push({base:x,x,y:y+17,w:w*.75,type:0,visible:true});if(i>8&&rand()<.3+difficulty*.23){const trapX=(x+W/2)%W;platforms.push({base:trapX,x:trapX,y:y-22,w:38+rand()*25,type:5,visible:true})}}
 player={x:240,y:525,vx:0,vy:-650};ultFant=0;camera=0;height=0;lava=760;fant={};report=0;direction=0;estado.textContent='Verde: normal · azul: móvil · naranja: se rompe · violeta: intermitente · amarillo: resorte · rojo: pinchos.';begin();c.progreso(0,1500)},alAcabarTiempo:finish,alCerrar(){active=false;release()}});resize();

let sala=null;
function conSala(fn){window.RatitoSala?fn(window.RatitoSala):addEventListener('ratitosala',()=>fn(window.RatitoSala),{once:true})}
conSala(api=>{sala=api;sala.al('mensaje',(d,de)=>{if(!d||d.app!=='salto-fant'||!Number.isFinite(d.x)||!Number.isFinite(d.y))return;fant[de.id]={muerto:!!d.muerto,x:d.x,y:d.y,h:d.h|0,name:String(de.name||'Amigo').slice(0,16),color:de.color||'#2D6CDF',t:performance.now()};if(!active&&!frame){last=performance.now();frame=requestAnimationFrame(loop)}})});
</script><script src="/lib/peerjs.min.js" defer></script><script src="/amigos.js" defer></script></body></html>
