<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mezcla — game.hub</title><link rel="icon" href="/favicon.svg?v=3" type="image/svg+xml"><link rel="stylesheet" href="/estilo.css"><style>
body{background:#fff;color:#15171C}main{max-width:680px;margin:70px auto 40px;padding:0 16px}h1{font-size:clamp(34px,8vw,54px);letter-spacing:-.05em;margin:0}.sub,small{color:#6B7079}button,input{font:inherit}button{border:2px solid #15171C;border-radius:16px;background:#fff;color:#15171C;box-shadow:0 4px 0 #15171C;padding:12px 16px;font-weight:700;cursor:pointer;touch-action:manipulation}button:active{transform:translateY(3px);box-shadow:0 1px 0 #15171C}button:focus-visible,input:focus-visible{outline:3px solid #2D6CDF;outline-offset:4px}button:disabled{opacity:.5;cursor:default}.modos{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:24px 0}.modos button{font-size:22px;padding:26px 12px;background:#FFF3C4}.modos button:last-child{background:#DDF3E6}.modos small{display:block;font-size:14px;font-weight:400;margin-top:8px}.panel{border:2px solid #15171C;border-radius:20px;padding:18px;margin:18px 0;background:#F2F3F5}#resultado{display:flex;align-items:center;gap:16px;min-height:108px;background:#fff}#big{font-size:48px;display:inline-block}#estado{font-weight:800;font-size:20px;margin:0}#detalle{margin:6px 0 0;color:#6B7079}#objetivo{background:#FFF3C4;font-size:22px;font-weight:800}#lista{display:flex;flex-wrap:wrap;gap:12px;padding:8px 0}#lista button{display:flex;align-items:center;gap:8px;min-height:58px}#lista span{font-size:28px}#lista button[aria-pressed=true]{background:#FFF3C4;outline:3px solid #2D6CDF;outline-offset:2px}h2{font-size:19px;margin:0 0 14px}#buscar{width:100%;border:2px solid #15171C;border-radius:12px;padding:10px;margin-bottom:14px}.acciones{display:flex;gap:12px;flex-wrap:wrap}.pop{animation:pop .4s ease-out}@keyframes pop{0%{transform:scale(.5) rotate(-12deg)}65%{transform:scale(1.2)}100%{transform:scale(1)}}[hidden]{display:none!important}@media(max-width:420px){.modos{grid-template-columns:1fr}#lista button{padding:10px}#estado{font-size:18px}}@media(prefers-reduced-motion:reduce){.pop{animation:none}}
</style></head><body><a class="volver" href="/">← game.hub</a><main><h1>Mezcla</h1><p class="sub">Toca un ingrediente y luego otro. ¡El resultado aparece al instante!</p>
<div class="modos" id="modos"><button id="libre">Modo libre<small>Combinaciones infinitas: cualquier pareja crea algo.</small></button><button id="conObjetivo">Con objetivo<small>Te proponemos algo fácil para crear.</small></button></div><div id="carrera" hidden></div>
<section id="juego" hidden><div id="objetivo" class="panel" hidden></div><div id="resultado" class="panel" role="status" aria-live="polite" aria-atomic="true"><span id="big">🧪</span><div><p id="estado"></p><p id="detalle"></p></div></div><div class="acciones"><button id="pista">💡 Una pista</button><button id="otro" hidden>Otro objetivo</button><button id="cambiar">Cambiar modo</button></div><section class="panel"><h2>Tu colección · <span id="contador"></span></h2><input id="buscar" type="search" placeholder="Buscar elemento…" aria-label="Buscar elemento"><div id="lista" aria-label="Ingredientes"></div></section><small>Nada se gasta. Puedes tocar dos veces el mismo ingrediente. Esc cancela la selección. Las recetas son asociaciones de juego.</small><p><small id="guardado"></small></p></section></main>
<script src="/carrera.js"></script><script src="./recetas.js?v=3"></script><script>
'use strict';
const $=id=>document.getElementById(id),{elements:E,recipes:R,parents:P,fusion}=MEZCLA;
const key='gamehub-mezcla-v2-nombres',base=[0,1,2,3],lookup=new Map(R.map(r=>[[r.a,r.b].sort((a,b)=>a-b).join(':'),r.out]));
// Lista explícita: de una a cuatro mezclas desde los cuatro ingredientes iniciales.
const objetivos=['Vapor','Lodo','Nube','Lluvia','Planta','Ladrillo','Piedra'].map(n=>E.find(e=>e.name===n).id);
let saved=new Set(base),known=new Set(base),selected=null,mode=null,target=null,locked=false,online=false;
const porNombre=new Map(E.map(e=>[e.name,e.id])),keyGen=key+'-infinitas',MUESTRA=400;
function registrar(x){let id=porNombre.get(x.name);if(id!==undefined)return id;id=E.length;E.push({...x,id,gen:true});porNombre.set(x.name,id);return id}
try{const gens=JSON.parse(localStorage.getItem(keyGen)||'[]');if(Array.isArray(gens))for(const g of gens){if(!g||typeof g.name!=='string'||typeof g.head!=='string'||typeof g.ico!=='string'||typeof g.emoji!=='string'||!Array.isArray(g.mods)||!g.mods.every(m=>typeof m==='string')||!Number.isInteger(g.rank)||g.rank<0||typeof g.cat!=='string')continue;saved.add(registrar({name:g.name,head:g.head,mods:g.mods,rank:g.rank,cat:g.cat,ico:g.ico,emoji:g.emoji}))}}catch{}
try{const names=JSON.parse(localStorage.getItem(key)||'[]');if(Array.isArray(names))for(const name of names){const id=porNombre.get(name);if(id!==undefined)saved.add(id)}}catch{}
function message(icon,title,detail=''){ $('big').textContent=icon;$('estado').textContent=title;$('detalle').textContent=detail;$('big').classList.remove('pop');void $('big').offsetWidth;$('big').classList.add('pop')}
function allowed(){return mode&&!locked&&(!online||c.jugando)}
function render(){const focused=document.activeElement?.closest('#lista button')?.dataset.id,query=$('buscar').value.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();$('lista').replaceChildren();const orden=mode==='libre'?[...known].reverse():[...known];let vistos=0;for(const id of orden){const e=E[id];if(!e.name.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().includes(query))continue;if(++vistos>MUESTRA)break;const b=document.createElement('button');b.type='button';b.dataset.id=id;b.setAttribute('aria-label',e.name);b.setAttribute('aria-pressed',String(id===selected));b.disabled=!allowed();const icon=document.createElement('span');icon.textContent=e.emoji;b.append(icon,document.createTextNode(e.name));$('lista').append(b)}if(!$('lista').children.length)$('lista').textContent='No hay elementos con ese nombre.';$('contador').textContent=mode==='libre'?known.size+' descubiertos · infinitas por crear'+(known.size>MUESTRA&&!query?' (se ven los últimos '+MUESTRA+'; busca para ver más)':''):known.size+'/'+E.filter(e=>!e.gen).length;if(focused!==undefined)$('lista').querySelector('[data-id="'+focused+'"]')?.focus({preventScroll:true});$('pista').disabled=!allowed();}
function goal(){ $('objetivo').hidden=target===null;if(target!==null)$('objetivo').textContent=(online?'🏁 Carrera · crea ':'🎯 Crea ')+E[target].emoji+' '+E[target].name;}
function begin(next,rand=Math.random){mode=next;locked=false;selected=null;known=new Set(next==='libre'?saved:base);target=next==='objetivo'?objetivos[Math.min(objetivos.length-1,Math.floor(rand()*objetivos.length))]:null;$('modos').hidden=true;$('juego').hidden=false;$('buscar').value='';$('otro').hidden=online||next==='libre';$('cambiar').hidden=online;goal();message('🧪','Toca dos ingredientes',target===null?'Empieza con Agua + Fuego.': 'Empiezas con agua, fuego, tierra y aire. Puedes pedir una pista.');render()}
function save(){try{localStorage.setItem(key,JSON.stringify([...saved].filter(id=>!E[id].gen).map(id=>E[id].name)));localStorage.setItem(keyGen,JSON.stringify([...saved].filter(id=>E[id].gen).map(id=>{const{name,head,mods,rank,cat,ico,emoji}=E[id];return{name,head,mods,rank,cat,ico,emoji}})));$('guardado').textContent='Colección libre guardada en este dispositivo.'}catch{$('guardado').textContent='El navegador no permite guardar la colección.'}}
function pick(id){if(!allowed()||!known.has(id))return;if(selected===null){selected=id;message(E[id].emoji,E[id].name+' + …','Toca el segundo ingrediente.');render();return}const a=selected;selected=null;let out=lookup.get([a,id].sort((x,y)=>x-y).join(':'));if(out===undefined&&mode==='libre')out=registrar(fusion(E[a],E[id]));if(out===undefined){message('💨','Esta pareja todavía no crea nada.',E[a].name+' + '+E[id].name+' · Prueba otra o pide una pista.');render();return}const fresh=!known.has(out);known.add(out);if(mode==='libre'){saved.add(out);save()}message(E[out].emoji,(fresh?'¡Nuevo! ':'')+E[out].name,E[a].name+' + '+E[id].name+' = '+E[out].name);if(online)c.progreso(known.has(target)?1:0,1);if(target===out){locked=true;message('🏆','¡Creaste '+E[out].name+'!',online?'¡Objetivo conseguido!':'¡Bien hecho! Prueba otro objetivo cuando quieras.');if(online)c.terminar(Math.max(1,Math.min(180000,Math.round(c.transcurrido))))}render()}
$('lista').onclick=e=>{const b=e.target.closest('button');if(b)pick(+b.dataset.id)};$('buscar').oninput=render;
$('pista').onclick=()=>{if(!allowed())return;let r;if(target!==null){function next(id){if(known.has(id))return null;const pair=P[id];for(const ingredient of pair){const step=next(ingredient);if(step)return step}return {a:pair[0],b:pair[1],out:id}}r=next(target)}else r=R.find(r=>known.has(r.a)&&known.has(r.b)&&!known.has(r.out));selected=null;$('buscar').value='';if(r)message('💡','Toca '+E[r.a].name+' y '+E[r.b].name,'Los dos están en tu colección.');else if(target===null)message('♾️','Ya tienes todas las recetas básicas','Sigue mezclando lo que sea: no tiene fin.');else message('🏆','¡Descubriste toda la colección!');render()};
$('libre').onclick=()=>{if(!window.RatitoSala?.activo)begin('libre')};$('conObjetivo').onclick=()=>{if(!window.RatitoSala?.activo)begin('objetivo')};$('otro').onclick=()=>{if(!online){const previous=target,choices=objetivos.filter(id=>id!==previous),next=choices[Math.floor(Math.random()*choices.length)];begin('objetivo',()=>objetivos.indexOf(next)/objetivos.length)}};$('cambiar').onclick=()=>{if(online)return;mode=null;selected=null;$('juego').hidden=true;$('modos').hidden=false};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&selected!==null){selected=null;message('🧪','Toca dos ingredientes','Selección cancelada.');render()}});
const c=Carrera({app:'mezcla',el:$('carrera'),enfocar:$('resultado'),limite:180000,mejor:'bajo',minValor:1,maxValor:180000,formato:v=>(v/1000).toFixed(2)+' s',vivo:v=>v?'¡Creado!':'Mezclando',alEmpezar(rand){begin('objetivo',rand)},alAcabarTiempo(){locked=true;message('⏳','¡Tiempo!','Puedes volver a intentarlo en la próxima carrera.');c.terminar(null);render()},alCerrar(){if(!online)return;locked=true;selected=null;render()}});
function sync(){const active=!!window.RatitoSala?.activo;if(active===online)return;online=active;mode=null;selected=null;locked=true;target=null;$('carrera').hidden=!online;$('modos').hidden=online;$('juego').hidden=!online;$('cambiar').hidden=online;$('otro').hidden=true;goal();if(online){known=new Set(base);message('🏁','Con objetivo · carrera','Cuando empiece la carrera, todos tendrán el mismo objetivo fácil.');render()}}
window.addEventListener('ratitosala',sync);setInterval(sync,200);sync();
</script><script src="/lib/peerjs.min.js" defer></script><script src="/amigos.js" defer></script></body></html>
