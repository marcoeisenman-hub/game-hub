<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Estela — game.hub</title><link rel="icon" href="/favicon.svg?v=3" type="image/svg+xml">

<style>
body{background:#fff}
main{max-width:980px;margin:64px auto 30px;padding:0 14px}
h1{font-size:clamp(32px,7vw,52px);letter-spacing:-.05em;margin:0}
.sub{color:var(--mut);margin:2px 0 10px}
.barra{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border:2px solid var(--ink);border-radius:16px;padding:10px 12px;margin-bottom:10px}
.barra b{font-size:1.05rem}
.barra small{display:block;color:var(--mut);font-weight:500}
.jug{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.jug span{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--ink);border-radius:99px;padding:3px 10px;font-weight:800;font-size:.85rem;background:#fff}
.jug span.muerto{opacity:.4;text-decoration:line-through}
.jug i{width:12px;height:12px;border-radius:3px;background:var(--pc)}
.jug em{font-style:normal;color:#F5B700;letter-spacing:-1px}
.marco{position:relative;border:2px solid var(--ink);border-radius:16px;overflow:hidden;background:#15171C}
canvas{display:block;width:100%;touch-action:none;cursor:crosshair}
.giros{display:none;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.giros button{font:900 1.6rem "Schibsted Grotesk",sans-serif;padding:18px 0;border-radius:16px;border:2px solid var(--ink);background:#fff;box-shadow:0 4px 0 var(--ink);touch-action:manipulation}
.giros button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
@media (pointer:coarse){.giros{display:grid}}
.nota{color:var(--mut);font-size:.9rem}
#bots{font:inherit;font-weight:700}
.btn:disabled{opacity:.4;cursor:default}
body.jugando .am-peer,body.jugando .am-edge{display:none!important}
</style></head><body><a class="volver" href="/">← game.hub</a>
<main>
  <h1>Estela</h1><p class="sub">Tu moto deja una pared de luz. Encierra a los demás y no choques con nada. El primero en ganar 3 rondas gana.</p>
  <div class="barra"><span id="st"><b>¿Listo?</b></span><span><label><input type="checkbox" id="bots" checked> <span id="botsT">Con bots</span></label> <button class="btn" id="go" type="button">Empezar</button></span></div>
  <div class="jug" id="jug"></div>
  <div class="marco"><canvas id="cv" aria-label="Tablero de Estela. Flechas o WASD para girar; en celular desliza el dedo o usa los botones."></canvas></div>
  <div class="giros"><button type="button" id="izq" aria-label="Girar a la izquierda">⟲</button><button type="button" id="der" aria-label="Girar a la derecha">⟳</button></div>
  <p class="nota">Flechas o WASD. En celular desliza el dedo sobre el tablero hacia donde quieres ir, o usa los botones de girar. Cada vez va más rápido.</p>
<div id="tablaSala" style="max-height:180px;overflow:auto;flex-shrink:0"></div></main>
<script>
'use strict';

// Resultado de partida: el líder suma; cada cliente anuncia una sola vez.
const premiosVistos=new Set();
function recibirPremio(g){const sala=window.RatitoSala,T=window.GameHubTabla;
  if(!sala?.activo||!T)return;
  T.css();
  if(g?.tabla&&Array.isArray(g.ganadores)&&g.ganadores.length&&!premiosVistos.has(g.id)){
    premiosVistos.add(g.id);T.guardar(g.tabla);T.anunciar(g.ganadores,'Estela',sala.yo.id);
  }
  document.getElementById('tablaSala').innerHTML=T.html();
}

const $=id=>document.getElementById(id),cv=$('cv'),ctx=cv.getContext('2d');
const GW=60,GH=40,META=3,APP='estela';
const COL=['#2D6CDF','#F5B700','#E63946','#1E9E6A','#6C4BD8','#F28C28','#0FA3B1','#E84A8A'];
const BOTS=['Bot Rayo','Bot Chispa','Bot Turbo','Bot Voltio'];
const SALIDAS=[[6,6,1,0],[GW-7,GH-7,-1,0],[GW-7,6,0,1],[6,GH-7,0,-1],[GW>>1,3,0,1],[GW>>1,GH-4,0,-1],[3,GH>>1,1,0],[GW-4,GH>>1,-1,0]];
let sala=null,R=null,marc={},campeon=null,timer=0,shake=0,parts=[],miDir=null,leaderId='';
const online=()=>!!(sala&&sala.activo),lider=()=>!online()||sala.lider(),yo=()=>online()?sala.yo.id:'yo';
const tx=d=>{if(online())sala.enviar({...d,app:APP})};
const esc=t=>String(t).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');

/* ---------- simulación (solo el líder) ---------- */
function libres(g,x,y,lim){ // cuántas celdas libres alcanza desde (x,y)
  if(x<0||y<0||x>=GW||y>=GH||g[y*GW+x])return -1;
  const seen=new Uint8Array(GW*GH),q=[y*GW+x];seen[q[0]]=1;let n=0;
  while(q.length&&n<lim){const i=q.pop();n++;const cx=i%GW,cy=(i/GW)|0;
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=cx+dx,ny=cy+dy;if(nx<0||ny<0||nx>=GW||ny>=GH)continue;const j=ny*GW+nx;if(!seen[j]&&!g[j]){seen[j]=1;q.push(j)}}}
  return n}
function pensarBot(p){
  const ops=[[p.dx,p.dy],[-p.dy,p.dx],[p.dy,-p.dx]];let mejor=null,mv=-1e9;
  for(let k=0;k<3;k++){const [dx,dy]=ops[k];let v=libres(R.grid,p.x+dx,p.y+dy,260);if(v<0)continue;
    // evitar chocar de frente con otra cabeza
    for(const o of R.ps)if(o!==p&&o.vivo&&Math.abs(o.x+o.dx-(p.x+dx))+Math.abs(o.y+o.dy-(p.y+dy))===0)v-=200;
    v+=(k===0?6:0)+Math.random()*(p.loco||8);if(v>mv){mv=v;mejor=[dx,dy]}}
  if(mejor&&Math.random()<.04){const [dx,dy]=ops[1+(Math.random()*2|0)];if(libres(R.grid,p.x+dx,p.y+dy,120)>100)mejor=[dx,dy]}
  if(mejor){p.dx=mejor[0];p.dy=mejor[1]}}
function empezar(){if(!lider()||(R&&!R.fin))return;if(campeon){marc={};campeon=null}
  const humanos=online()?sala.jugadores().map(j=>({id:j.id,name:j.name})):[{id:'yo',name:'Tú'}];
  const ps=humanos.slice(0,8).map(h=>({...h,bot:false}));
  if($('bots').checked||ps.length<2){let b=0;while(ps.length<4)ps.push({id:'bot'+b,name:BOTS[b++],bot:true})}
  const sal=SALIDAS.slice(0,Math.max(4,ps.length));for(let i=sal.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[sal[i],sal[j]]=[sal[j],sal[i]]}
  ps.forEach((p,i)=>{p.color=COL[i%COL.length];[p.x,p.y,p.dx,p.dy]=sal[i];p.vivo=true;if(p.bot)p.loco=4+Math.random()*14});
  const d={type:'ronda',id:Math.random().toString(36).slice(2,9),ps:ps.map(p=>({id:p.id,name:p.name,color:p.color,x:p.x,y:p.y,dx:p.dx,dy:p.dy,bot:p.bot})),marc};
  tx(d);ronda(d);clearTimeout(timer);timer=setTimeout(tick,3000)}
function tick(){if(!R||R.fin||!lider())return;R.n++;
  for(const p of R.ps){if(!p.vivo)continue;if(p.bot)pensarBot(p);else if(p.cola.length){const [dx,dy]=p.cola.shift();if(dx!==-p.dx||dy!==-p.dy){p.dx=dx;p.dy=dy}}}
  const dest=R.ps.map(p=>p.vivo?[p.x+p.dx,p.y+p.dy]:null),vivo=R.ps.map(p=>p.vivo);
  dest.forEach((t,i)=>{if(!t)return;const [x,y]=t;if(x<0||y<0||x>=GW||y>=GH||R.grid[y*GW+x])vivo[i]=false;
    dest.forEach((u,j)=>{if(j!==i&&u&&u[0]===x&&u[1]===y)vivo[i]=false})});
  const d=[];R.ps.forEach((p,i)=>{const t=dest[i];d.push(t?t[0]:p.x,t?t[1]:p.y,vivo[i]?1:0,p.dx,p.dy)});
  tx({type:'t',id:R.id,n:R.n,d});aplicar(d);
  const vivos=R.ps.filter(p=>p.vivo),humVivos=vivos.filter(p=>!p.bot);
  if(vivos.length<=1){const w=vivos.length>=1?vivos[0].id:null;if(w)marc[w]=(marc[w]||0)+1;
    const camp=Object.keys(marc).find(k=>marc[k]>=META)||null;const f={type:'fin',id:R.id,gan:w,marc,camp};if(online()&&sala.lider()&&camp&&window.GameHubTabla){f.ganadores=R.ps.filter(p=>p.id===camp&&!p.bot).map(({id,name,color})=>({id,name,color}));if(f.ganadores.length)f.tabla=GameHubTabla.sumar(f.ganadores)}tx(f);fin(f);
    if(!camp)timer=setTimeout(()=>{if(R&&R.fin&&lider())empezar()},2600);return}
  // si ya no queda ninguna persona viva, se acelera para ver quién gana
  timer=setTimeout(tick,humVivos.length?Math.max(40,82-R.n*.22):22)}

/* ---------- estado compartido (todos) ---------- */
function ronda(d){if(!d||!Array.isArray(d.ps)||!d.ps.length)return;
  R={id:d.id,ps:d.ps.slice(0,8).map(p=>({id:String(p.id),name:String(p.name||'?').slice(0,20),color:String(p.color),x:p.x|0,y:p.y|0,dx:p.dx|0,dy:p.dy|0,bot:!!p.bot,vivo:true,cola:[]})),
     grid:new Uint8Array(GW*GH),n:0,start:performance.now()+3000,fin:null};
  R.ps.forEach((p,i)=>{if(p.x>=0&&p.y>=0&&p.x<GW&&p.y<GH)R.grid[p.y*GW+p.x]=i+1});
  if(d.marc&&typeof d.marc==='object')marc=d.marc;campeon=null;parts=[];
  const m=R.ps.find(p=>p.id===yo());miDir=m?[m.dx,m.dy]:null;pintaJug()}
let pedido=0;function pedir(){const t=Date.now();if(t-pedido<1000)return;pedido=t;tx({type:'pedir'})}
function snapshot(d){if(!Array.isArray(d.ps)||!Array.isArray(d.g))return;ronda({id:d.id,ps:d.ps,marc:d.marc});R.n=d.n|0;R.start=performance.now()+Math.min(3000,+d.falta||0);
  const g=new Uint8Array(GW*GH);let k=0;for(let i=0;i+1<d.g.length&&k<g.length;i+=2){g.fill(d.g[i]|0,k,Math.min(g.length,k+(d.g[i+1]|0)));k+=d.g[i+1]|0}R.grid=g;
  d.ps.forEach((p,i)=>{if(R.ps[i])R.ps[i].vivo=p.vivo!==false});if(d.fin)R.fin=d.fin;campeon=d.camp||null;recibirPremio(d.fin);pintaJug()}
function aplicar(d){if(!R||!Array.isArray(d))return;R.ps.forEach((p,i)=>{if(!p.vivo)return;const x=d[i*5]|0,y=d[i*5+1]|0,v=d[i*5+2];p.dx=d[i*5+3]|0;p.dy=d[i*5+4]|0;
    if(v){p.x=x;p.y=y;if(x>=0&&y>=0&&x<GW&&y<GH)R.grid[y*GW+x]=i+1}else{p.vivo=false;boom(p);if(window.GameHubFx&&GameHubFx.tono){GameHubFx.tono(p.id===yo()?90:160,.3,'sawtooth',p.id===yo()?.08:.04)}if(p.id===yo())shake=14;else shake=Math.max(shake,5)}});pintaJug()}
function fin(f){if(!R||f.id!==R.id)return;R.fin=f;if(f.marc&&typeof f.marc==='object')marc=f.marc;campeon=f.camp||null;recibirPremio(f);pintaJug()}
function boom(p){const ex=p.x+p.dx,ey=p.y+p.dy;for(let k=0;k<26;k++){const a=Math.random()*6.283,s=2+Math.random()*9;parts.push({x:ex+.5,y:ey+.5,vx:Math.cos(a)*s,vy:Math.sin(a)*s,t:.6+Math.random()*.5,c:p.color})}}
function nombre(id){const p=R&&R.ps.find(q=>q.id===id);return p?(p.id===yo()&&online()?'Tú':p.name):'Alguien'}
function pintaJug(){const ps=R?R.ps:[];$('jug').innerHTML=ps.map(p=>`<span class="${p.vivo?'':'muerto'}" style="--pc:${esc(p.color)}"><i></i>${esc(p.id===yo()?'Tú':p.name)} <em>${'★'.repeat(Math.min(META,marc[p.id]||0))}</em></span>`).join('')}
function estado(){recibirPremio(R?.fin);let s,sub='';const now=performance.now();
  if(!R){s=online()?(lider()?'Tú eres el líder: dale a Empezar.':'Esperando a que el líder empiece…'):'¿Listo?';sub='Gana el primero en llegar a '+META+' rondas.'}
  else if(R.fin){const w=R.fin.gan;s=campeon?(campeon===yo()?'¡GANASTE LA PARTIDA!':nombre(campeon)+' gana la partida'):w?(w===yo()?'¡Ganaste la ronda!':nombre(w)+' gana la ronda'):'Nadie sobrevivió';sub=R.fin.abort?'Cambió el líder: '+(lider()?'dale a Empezar.':'el nuevo líder puede empezar.'):campeon?(lider()?'Dale a Empezar para otra partida.':'El líder puede empezar otra.'):'Siguiente ronda en un momento…'}
  else if(now<R.start)s='Prepárate…';else{const m=R.ps.find(p=>p.id===yo());s=m?(m.vivo?'¡No choques!':'Te chocaste… mira quién gana (en cámara rápida si ya no queda nadie)'):'Mirando la ronda'}
  document.body.classList.toggle('jugando',!!R&&!R.fin);
  $('st').innerHTML='<b>'+esc(s)+'</b>'+(sub?'<small>'+esc(sub)+'</small>':'');
  $('go').disabled=!lider()||(R&&!R.fin&&true)||(R&&R.fin&&!campeon&&!R.fin.abort&&true);$('go').textContent=lider()?(campeon?'Otra partida':'Empezar'):'El líder empieza';if(!online()){$('bots').checked=true;$('bots').disabled=true;$('botsT').textContent='Solo: contra bots'}else{$('bots').disabled=!lider()||(R&&!R.fin);$('botsT').textContent='Con bots'}}

/* ---------- controles ---------- */
function girar(dx,dy){if(!R||R.fin)return;const m=R.ps.find(p=>p.id===yo());if(!m||!m.vivo)return;
  const ref=miDir||[m.dx,m.dy];if((dx===-ref[0]&&dy===-ref[1])||(dx===ref[0]&&dy===ref[1]))return;miDir=[dx,dy];
  if(lider()){if(m.cola.length<3)m.cola.push([dx,dy])}else tx({type:'giro',id:R.id,dx,dy})}
function relativo(s){if(!R)return;const m=R.ps.find(p=>p.id===yo());if(!m)return;const [dx,dy]=miDir||[m.dx,m.dy];s<0?girar(dy,-dx):girar(-dy,dx)}
addEventListener('keydown',e=>{if(e.target.closest&&e.target.closest('input,textarea,select,[contenteditable]'))return;
  const k=e.key.toLowerCase(),m={arrowup:[0,-1],w:[0,-1],arrowdown:[0,1],s:[0,1],arrowleft:[-1,0],a:[-1,0],arrowright:[1,0],d:[1,0]}[k];
  if(m){e.preventDefault();girar(m[0],m[1])}});
let toque=null;
cv.addEventListener('pointerdown',e=>{e.preventDefault();toque={x:e.clientX,y:e.clientY}});
cv.addEventListener('pointermove',e=>{if(!toque)return;const dx=e.clientX-toque.x,dy=e.clientY-toque.y;if(Math.hypot(dx,dy)<22)return;
  Math.abs(dx)>Math.abs(dy)?girar(Math.sign(dx),0):girar(0,Math.sign(dy));toque={x:e.clientX,y:e.clientY}});
addEventListener('pointerup',()=>toque=null);
$('izq').addEventListener('pointerdown',e=>{e.preventDefault();relativo(-1)});$('der').addEventListener('pointerdown',e=>{e.preventDefault();relativo(1)});
$('go').onclick=empezar;

/* ---------- dibujo ---------- */
let cel=10,last=0;
function tam(){const w=cv.clientWidth;cel=w/GW;const dpr=Math.min(2,devicePixelRatio||1);cv.style.height=(cel*GH)+'px';cv.width=Math.round(w*dpr);cv.height=Math.round(cel*GH*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',tam);
function dibujar(t){const dt=Math.min(.05,(t-last)/1000||0);last=t;
  ctx.save();if(shake>0){ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.86;if(shake<.4)shake=0}
  ctx.fillStyle='#15171C';ctx.fillRect(-20,-20,cv.width+40,cv.height+40);
  ctx.fillStyle='#262A33';for(let y=0;y<GH;y+=4)for(let x=0;x<GW;x+=4)ctx.fillRect(x*cel+cel/2-1,y*cel+cel/2-1,2,2);
  if(R){const g=R.grid;
    for(let i=0;i<g.length;i++){const k=g[i];if(!k)continue;const p=R.ps[k-1];ctx.globalAlpha=p.vivo?1:.38;ctx.fillStyle=p.color;ctx.fillRect((i%GW)*cel+.5,((i/GW)|0)*cel+.5,cel-1,cel-1)}
    ctx.globalAlpha=1;
    for(const p of R.ps){if(!p.vivo)continue;const x=p.x*cel,y=p.y*cel;ctx.fillStyle='#fff';ctx.shadowColor=p.color;ctx.shadowBlur=14;ctx.fillRect(x-cel*.25,y-cel*.25,cel*1.5,cel*1.5);ctx.shadowBlur=0;
      ctx.strokeStyle=p.color;ctx.lineWidth=2;ctx.strokeRect(x-cel*.25,y-cel*.25,cel*1.5,cel*1.5)}
    const now=performance.now();
    if(now<R.start&&!R.fin){ctx.font='800 13px "Schibsted Grotesk",sans-serif';ctx.textAlign='center';
      for(const p of R.ps){const tx0=(p.x+.5)*cel,ty0=(p.y+.5)*cel;ctx.fillStyle=p.color;ctx.fillText(p.id===yo()?'TÚ':p.name,tx0,ty0-cel*1.3);
        ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(tx0,ty0);ctx.lineTo(tx0+p.dx*cel*3,ty0+p.dy*cel*3);ctx.stroke()}
      ctx.font='900 '+Math.round(cel*12)+'px "Schibsted Grotesk",sans-serif';ctx.fillStyle='#fff';ctx.textBaseline='middle';ctx.fillText(String(Math.ceil((R.start-now)/1000)),GW*cel/2,GH*cel/2);ctx.textBaseline='alphabetic'}
    if(R.fin){ctx.fillStyle='#15171Caa';ctx.fillRect(0,0,GW*cel,GH*cel);ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#fff';
      ctx.font='900 '+Math.round(cel*5)+'px "Schibsted Grotesk",sans-serif';const w=R.fin.gan;
      ctx.fillText(campeon?(campeon===yo()?'¡CAMPEÓN!':nombre(campeon).toUpperCase()+' GANA'):w?(w===yo()?'¡GANASTE!':nombre(w).toUpperCase()):'EMPATE',GW*cel/2,GH*cel/2);ctx.textBaseline='alphabetic'}
  }else{ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='900 '+Math.round(cel*4)+'px "Schibsted Grotesk",sans-serif';ctx.fillText('ESTELA',GW*cel/2,GH*cel/2)}
  for(const q of parts){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=.94;q.vy*=.94;q.t-=dt;ctx.globalAlpha=Math.max(0,q.t);ctx.fillStyle=q.c;ctx.fillRect(q.x*cel-3,q.y*cel-3,6,6)}
  ctx.globalAlpha=1;parts=parts.filter(q=>q.t>0);ctx.restore();requestAnimationFrame(dibujar)}
tam();requestAnimationFrame(dibujar);setInterval(estado,200);estado();

/* ---------- sala ---------- */
function conSala(fn){window.RatitoSala?fn(window.RatitoSala):addEventListener('ratitosala',()=>fn(window.RatitoSala),{once:true})}
conSala(api=>{sala=api;
  sala.al('mensaje',(d,de)=>{if(!d||d.app!==APP)return;const jefe=sala.jugadores()[0]?.id;
    if(d.type==='giro'&&lider()&&R&&!R.fin&&d.id===R.id){const p=R.ps.find(q=>q.id===de.id&&!q.bot);if(p&&p.cola.length<3&&Math.abs(d.dx|0)+Math.abs(d.dy|0)===1)p.cola.push([d.dx|0,d.dy|0])}
    if(d.type==='pedir'&&lider()&&R){const g=[];let v=R.grid[0],n=0;for(let i=0;i<R.grid.length;i++){if(R.grid[i]===v&&n<255)n++;else{g.push(v,n);v=R.grid[i];n=1}}g.push(v,n);
      tx({type:'snap',to:de.id,id:R.id,n:R.n,ps:R.ps.map(p=>({id:p.id,name:p.name,color:p.color,x:p.x,y:p.y,dx:p.dx,dy:p.dy,bot:p.bot,vivo:p.vivo})),g,marc,fin:R.fin,camp:campeon,falta:Math.max(0,R.start-performance.now())})}
    if(de.id!==jefe)return;
    if(d.type==='ronda'&&!lider())ronda(d);
    if(d.type==='t'&&!lider()){if(R&&d.id===R.id&&d.n===R.n+1){R.n=d.n;aplicar(d.d)}else if(!(R&&d.id===R.id&&d.n<=R.n))pedir()}
    if(d.type==='snap'&&!lider()&&d.to===yo())snapshot(d)
    if(d.type==='fin'&&!lider())fin(d)});
  sala.al('cambio',()=>{const lid=online()?sala.jugadores()[0]?.id:'';if(lid!==leaderId){leaderId=lid;if(R&&!R.fin){clearTimeout(timer);R.fin={gan:null,id:R.id,abort:true};}}if(online()&&!lider())pedir();estado()});
  if(online()&&!lider())setTimeout(pedir,600);estado()});
</script>
<script src="/carrera.js" defer></script>
<script src="/lib/peerjs.min.js" defer></script><script src="/amigos.js" defer></script>
</body></html>
