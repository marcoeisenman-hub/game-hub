<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Arena — game.hub</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/estilo.css">
<style>
html,body{height:100%;overflow:hidden;background:#121315}
#view{position:fixed;left:0;top:0;width:100%;touch-action:none;cursor:crosshair}
.intro{position:fixed;top:14px;right:18px;color:#d4d1cb;text-align:right;pointer-events:none;text-shadow:0 1px 4px #000}
.intro h1{font-size:1.15rem;margin:0;font-weight:700}
.intro p{font-size:.8rem;margin:2px 0;color:#a9a59d}
.tools{position:fixed;bottom:0;left:0;right:0;background:#1C1D20;border-top:1px solid #2E3035;padding:10px max(12px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom));display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:10px 16px;color:#E6E3DD}
.materials{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.mat{font:inherit;cursor:pointer;border:1px solid transparent;background:transparent;color:#C9C5BD;border-radius:9px;padding:6px 10px;font-size:.85rem;display:flex;gap:7px;align-items:center}
.mat:hover{background:#26282C}
.mat[aria-pressed=true]{border-color:#5A5D63;background:#2B2D32;color:#fff}
.sw{width:14px;height:14px;border-radius:4px;background:var(--c);box-shadow:inset 0 0 0 1px #0005}
.tools label{font-size:.8rem;display:flex;align-items:center;gap:8px;color:#A9A59D}
.tools input{width:96px;accent-color:#D8BE8A}
.tools .btn{background:#2B2D32;color:#E6E3DD;border:1px solid #3A3D43;padding:7px 12px;font-size:.82rem}
.tools .btn:hover{background:#34373C}
@media(max-width:560px){.intro p{display:none}.mat{padding:5px 7px;font-size:.78rem}.materials{gap:2px}}
</style>
</head>
<body>
<a class="volver" href="/">← game.hub</a>
<div class="intro"><h1>Arena</h1><p>Elige un material y dibuja. Prueba lava sobre agua o fuego en el aceite.</p></div>
<canvas id="view" aria-label="Simulación de arena. Elige un material y dibuja con el dedo o el mouse."></canvas>
<div class="tools">
  <div class="materials" role="group" aria-label="Material"></div>
  <label>Pincel <input id="size" type="range" min="1" max="16" value="5"></label>
  <button class="btn" id="pause" aria-pressed="false">Pausa</button>
  <button class="btn" id="clear">Limpiar</button>
</div>
<script>
'use strict';
/* tipos */
const E=0,SAND=1,WATER=2,STONE=3,WOOD=4,FIRE=5,SMOKE=6,STEAM=7,OIL=8,LAVA=9,ASH=10,EMBER=11,SPONGE=12,SPMAX=5;
const MENU=[[SAND,'Arena','#D2B98A'],[WATER,'Agua','#2F6F98'],[STONE,'Piedra','#7D7F80'],[WOOD,'Madera','#7A5634'],[SPONGE,'Esponja','#E3C54F'],[OIL,'Aceite','#4A3816'],[FIRE,'Fuego','#F08A24'],[LAVA,'Lava','#E8501C'],[E,'Borrador','#3A3C40']];
const view=document.getElementById('view'),vctx=view.getContext('2d'),tools=document.querySelector('.tools');
const sim=document.createElement('canvas'),sctx=sim.getContext('2d');
const glow=document.createElement('canvas'),gctx=glow.getContext('2d');
const tiny=document.createElement('canvas'),tctx=tiny.getContext('2d');
const bg=document.createElement('canvas'),bgx=bg.getContext('2d');
const GW=360,GH=210;let SC=2,OX=0,OY=0;
const enSala=()=>!!(window.RatitoSala&&RatitoSala.activo);
let W=0,H=0,CELL=2,N=0,type,shade,life,vel,stamp,img,gimg,sel=SAND,brush=5,tick=0,paused=false,dpr=1,viewH=0;
const ptr=new Map();

/* menú */
for(const [t,n,c] of MENU){const b=document.createElement('button');b.className='mat';b.innerHTML=`<span class="sw" style="--c:${c}"></span>${n}`;
  b.setAttribute('aria-pressed',t===sel);b.onclick=()=>{sel=t;document.querySelectorAll('.mat').forEach(x=>x.setAttribute('aria-pressed',x===b))};document.querySelector('.materials').append(b)}
document.getElementById('size').oninput=e=>brush=+e.target.value;
document.getElementById('clear').onclick=()=>{type.fill(0);life.fill(0);vel.fill(0);tx({clear:1})};
function setPause(v){paused=v;const b=document.getElementById('pause');b.textContent=paused?'Seguir':'Pausa';b.setAttribute('aria-pressed',paused)}
document.getElementById('pause').onclick=()=>{setPause(!paused);tx({pause:paused})};

/* tamaño */
function resize(){
  dpr=Math.min(2,devicePixelRatio||1);viewH=innerHeight-tools.getBoundingClientRect().height;
  view.style.height=viewH+'px';view.width=Math.round(innerWidth*dpr);view.height=Math.round(viewH*dpr);
  const area=innerWidth*viewH;CELL=Math.max(2,Math.round(Math.sqrt(area/150000)));
  let nw=Math.ceil(innerWidth/CELL),nh=Math.ceil(viewH/CELL);
  if(enSala()){nw=GW;nh=GH;SC=Math.min(innerWidth/GW,viewH/GH);OX=(innerWidth-GW*SC)/2;OY=viewH-GH*SC}else{SC=CELL;OX=0;OY=0}
  if(nw!==W||nh!==H){
    const o={W,H,type,shade,life,vel};W=nw;H=nh;N=W*H;
    type=new Uint8Array(N);shade=new Uint8Array(N);life=new Uint16Array(N);vel=new Uint8Array(N);stamp=new Uint8Array(N);
    if(o.type)for(let y=0;y<Math.min(H,o.H);y++)for(let x=0;x<Math.min(W,o.W);x++){const i=(H-1-y)*W+x,j=(o.H-1-y)*o.W+x;type[i]=o.type[j];shade[i]=o.shade[j];life[i]=o.life[j]}
    sim.width=glow.width=W;sim.height=glow.height=H;tiny.width=Math.max(1,W>>3);tiny.height=Math.max(1,H>>3);
    img=sctx.createImageData(W,H);gimg=gctx.createImageData(W,H);
  }
  bg.width=view.width;bg.height=view.height;
  const g=bgx.createLinearGradient(0,0,0,bg.height);g.addColorStop(0,'#1A1B1E');g.addColorStop(1,'#0E0F11');bgx.fillStyle=g;bgx.fillRect(0,0,bg.width,bg.height);
  const v=bgx.createRadialGradient(bg.width/2,bg.height*.45,bg.height*.2,bg.width/2,bg.height*.5,Math.max(bg.width,bg.height)*.75);v.addColorStop(0,'rgba(255,240,220,.035)');v.addColorStop(1,'rgba(0,0,0,.35)');bgx.fillStyle=v;bgx.fillRect(0,0,bg.width,bg.height);
}
new ResizeObserver(resize).observe(tools);addEventListener('resize',resize);resize();

/* utilidades */
const R=Math.random;
function set(i,t){type[i]=t;shade[i]=R()*256|0;vel[i]=0;stamp[i]=tick;
  life[i]=t===FIRE?18+R()*40:t===SMOKE?90+R()*140:t===STEAM?140+R()*180:t===EMBER?260+R()*300:t===LAVA?0:0}
function swap(i,j){let t=type[i];type[i]=type[j];type[j]=t;t=shade[i];shade[i]=shade[j];shade[j]=t;t=life[i];life[i]=life[j];life[j]=t;t=vel[i];vel[i]=vel[j];vel[j]=t;stamp[i]=stamp[j]=tick}
const liquid=t=>t===WATER||t===OIL;
const gas=t=>t===SMOKE||t===STEAM||t===FIRE;
function enter(t,q){ // ¿t puede ocupar el lugar de q?
  if(q===E)return true;
  if(gas(q))return t!==FIRE&&!gas(t);
  if(t===SAND||t===ASH)return liquid(q)&&R()<.45;
  if(t===WATER)return q===OIL&&R()<.5;
  if(t===LAVA)return false;
  return false;
}
function near(i,x,y,t){ // ¿hay t alrededor?
  if(x>0&&type[i-1]===t)return i-1;if(x<W-1&&type[i+1]===t)return i+1;
  if(y>0&&type[i-W]===t)return i-W;if(y<H-1&&type[i+W]===t)return i+W;return -1}

/* esponja: chupa agua y aceite, la pasa a la esponja de al lado y gotea cuando está llena */
function esponja(i,x,y){
  const vec=[];if(x>0)vec.push(i-1);if(x<W-1)vec.push(i+1);if(y>0)vec.push(i-W);if(y<H-1)vec.push(i+W);
  for(const j of vec){const q=type[j];
    if((q===WATER||q===OIL)&&life[i]<SPMAX&&R()<.6){type[j]=E;life[i]++;stamp[j]=tick}
    else if(q===SPONGE&&life[i]>life[j]+1&&R()<.5){life[i]--;life[j]++}
    else if((q===FIRE||q===LAVA||q===EMBER)&&life[i]>0&&R()<.2){life[i]--;if(y>0&&type[i-W]===E)set(i-W,STEAM)}}
  // llena: gotea por debajo
  if(life[i]>=SPMAX&&y<H-1&&type[i+W]===E&&R()<.02){set(i+W,WATER);life[i]--}
}
/* física */
function fall(i,x,y,t,maxV,spread){
  // caída con aceleración
  let v=Math.min(maxV,vel[i]+1),j=i,yy=y,k=0;
  while(k<(v+1>>1)&&yy<H-1&&enter(t,type[j+W])){j+=W;yy++;k++}
  if(k){vel[j]=v;swap(i,j);if(j!==i)vel[j]=v;return true}
  vel[i]=0;
  const d=R()<.5?1:-1;
  const wetSand=t===SAND&&(near(i,x,y,WATER)>=0);
  if(y<H-1&&!(wetSand&&R()<.9)&&!(t===SAND&&R()<.12)){
    for(const s of [d,-d]){const xx=x+s;if(xx<0||xx>=W)continue;const j2=i+W+s;if(enter(t,type[j2])&&(type[i+s]===E||liquid(type[i+s])||gas(type[i+s]))){swap(i,j2);return true}}
  }
  if(spread){ // líquidos se esparcen
    let best=i;for(let s=1;s<=spread;s++){const xx=x+d*s;if(xx<0||xx>=W)break;const q=type[i+d*s];if(q===E||gas(q))best=i+d*s;else break;
      if(y<H-1&&type[i+d*s+W]===E){best=i+d*s;break}}
    if(best!==i){swap(i,best);return true}
  }
  return false;
}
function rise(i,x,y,t,jitter){
  if(y===0){if(t!==FIRE&&R()<.04)type[i]=E;return}
  const d=R()<.5?1:-1,opts=[i-W,i-W+d,i-W-d];
  for(const j of opts){const xx=j%W;if(Math.abs(xx-x)>1)continue;const q=type[j];if(q===E||(liquid(q)&&t!==FIRE&&R()<.3)){if(R()<jitter){swap(i,j);return}}}
  const s=i+d;if(x+d>=0&&x+d<W&&type[s]===E&&R()<.5)swap(i,s);
}
function ignite(j){const q=type[j];if(q===SPONGE){if(life[j]===0&&R()<.02){set(j,FIRE);life[j]=40+R()*40}return}if(q===WOOD&&R()<.035)set(j,EMBER);else if(q===OIL&&R()<.25){set(j,FIRE);life[j]=60+R()*60}}
function igniteAround(i,x,y){if(x>0)ignite(i-1);if(x<W-1)ignite(i+1);if(y>0)ignite(i-W);if(y<H-1)ignite(i+W)}
function step(){
  tick=(tick+1)&255;
  for(const p of ptr.values())paint(p.x,p.y);
  const lr=tick&1;
  for(let y=H-1;y>=0;y--){
    for(let k=0;k<W;k++){
      const x=lr?k:W-1-k,i=y*W+x,t=type[i];
      if(t===E||t===STONE||t===WOOD||stamp[i]===tick)continue;
      if(t===SPONGE){esponja(i,x,y);continue}
      switch(t){
        case SAND:fall(i,x,y,t,10,0);break;
        case ASH:if(R()<.6)fall(i,x,y,t,3,0);break;
        case WATER:{const f=near(i,x,y,FIRE);if(f>=0&&R()<.5){type[f]=E;if(R()<.15)set(i,STEAM);break}
          fall(i,x,y,t,10,6);break}
        case OIL:{const f=near(i,x,y,FIRE);if(f>=0)ignite(i);else{const e=near(i,x,y,EMBER);if(e>=0)ignite(i)}
          if(type[i]===OIL)fall(i,x,y,t,8,4);break}
        case LAVA:{
          const w=near(i,x,y,WATER);if(w>=0){set(w,STEAM);if(R()<.45){set(i,STONE);break}}
          igniteAround(i,x,y);
          if(y>0&&type[i-W]===E&&R()<.004)set(i-W,SMOKE);
          if(tick%3===0)fall(i,x,y,t,2,1);break}
        case FIRE:{
          if(--life[i]<=0){type[i]=R()<.35?SMOKE:E;if(type[i]===SMOKE)life[i]=60+R()*90;break}
          igniteAround(i,x,y);
          rise(i,x,y,t,.55);break}
        case EMBER:{ // madera ardiendo
          if(--life[i]<=0){if(R()<.55){set(i,ASH)}else type[i]=E;break}
          if(near(i,x,y,WATER)>=0&&R()<.3){type[i]=WOOD;const w=near(i,x,y,WATER);if(w>=0)set(w,STEAM);break}
          if(y>0&&type[i-W]===E&&R()<.35)set(i-W,R()<.8?FIRE:SMOKE);
          igniteAround(i,x,y);
          break}
        case SMOKE:if(--life[i]<=0){type[i]=E;break}rise(i,x,y,t,.6);break;
        case STEAM:if(--life[i]<=0){type[i]=R()<.25?WATER:E;break}rise(i,x,y,t,.7);break;
      }
    }
  }
}

/* pincel */
function paint(cx,cy,mat=sel,br=brush,remoto=false){const r=br;if(!remoto)queuePaint(cx,cy);
  for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){
    if(dx*dx+dy*dy>r*r)continue;const x=cx+dx,y=cy+dy;if(x<0||x>=W||y<0||y>=H)continue;const i=y*W+x;
    if(mat===E){type[i]=E;continue}
    if(mat===STONE||mat===WOOD||mat===SPONGE){if(type[i]===E||gas(type[i]))set(i,mat);continue}
    if(type[i]===E&&R()<(mat===FIRE?.35:.5))set(i,mat)}}
function pos(e){const r=view.getBoundingClientRect();return{x:Math.floor((e.clientX-r.left-OX)/SC),y:Math.floor((e.clientY-r.top-OY)/SC)}}
view.addEventListener('pointerdown',e=>{if(e.button!==0)return;e.preventDefault();view.setPointerCapture(e.pointerId);const p=pos(e);ptr.set(e.pointerId,p);paint(p.x,p.y)});
view.addEventListener('pointermove',e=>{if(!ptr.has(e.pointerId))return;const a=ptr.get(e.pointerId),b=pos(e),n=Math.max(Math.abs(b.x-a.x),Math.abs(b.y-a.y),1);
  for(let k=1;k<=n;k+=Math.max(1,brush>>1))paint(Math.round(a.x+(b.x-a.x)*k/n),Math.round(a.y+(b.y-a.y)*k/n));ptr.set(e.pointerId,b)});
for(const n of ['pointerup','pointercancel','lostpointercapture'])view.addEventListener(n,e=>ptr.delete(e.pointerId));
addEventListener('blur',()=>ptr.clear());

/* dibujo */
const SANDC=[[219,196,147],[207,182,132],[228,208,163],[196,170,121],[214,188,138],[186,160,112]];
function render(){
  const a=img.data,g=gimg.data;
  for(let x=0;x<W;x++){
    let depth=0,oilD=0;
    for(let y=0;y<H;y++){
      const i=y*W+x,t=type[i],s=shade[i],j=i*4;let r=0,gg=0,b=0,al=255,em=0;
      if(t!==WATER)depth=0;if(t!==OIL)oilD=0;
      const top=y>0?type[i-W]:E,lit=(top===E||gas(top))?14:0;
      switch(t){
        case E:al=0;break;
        case SAND:{const c=SANDC[s%6];let m=1;if(y<H-1&&(type[i+W]===WATER||type[i-1]===WATER||type[i+1]===WATER||top===WATER))m=.66;r=c[0]*m+lit;gg=c[1]*m+lit;b=c[2]*m+lit*.8;break}
        case WATER:{depth++;const d=Math.min(depth,40)/40;r=38-20*d;gg=104-46*d;b=146-50*d;al=150+70*d;
          if(depth===1){r+=55;gg+=60;b+=55;al=220}else if((s+tick)%61===0){r+=18;gg+=22;b+=24}break}
        case OIL:{oilD++;r=70-oilD*.6;gg=52-oilD*.5;b=20;al=225;if(oilD===1){r+=50;gg+=42;b+=20}break}
        case STONE:{const v=(s%40)-20,sp=s>246?-35:0;r=118+v+sp+lit*.6;gg=120+v+sp+lit*.6;b=121+v+sp+lit*.6;break}
        case SPONGE:{const w=life[i]/SPMAX,po=(s%7===0||(s+x*3+y*5)%11===0)?.72:1;r=(227-90*w)*po+lit*.5;gg=(197-85*w)*po+lit*.5;b=(79-25*w+30*w)*po;break}
        case WOOD:{const ring=Math.sin(y*.9+(s%9)*.15+x*.05)*14;r=120+ring+(s%12)-6;gg=84+ring*.7+(s%10)-5;b=52+ring*.4;break}
        case ASH:{const v=(s%30)-15;r=112+v;gg=108+v;b=103+v;break}
        case FIRE:{const k=Math.min(1,life[i]/45),f=R()*.25;r=255;gg=90+150*k*(1-f);b=20+120*Math.max(0,k-.6)*(1-f);al=210+45*k;em=220*k+60;break}
        case EMBER:{const f=.6+R()*.4;r=200*f+40;gg=70*f;b=20;em=150*f;break}
        case LAVA:{const f=Math.sin((s+tick*2)*.08)*.5+.5;r=235+20*f;gg=70+80*f;b=15+20*f;em=170+60*f;break}
        case SMOKE:{const k=Math.min(1,life[i]/120);r=gg=b=70+(s%20);al=40+110*k;break}
        case STEAM:{const k=Math.min(1,life[i]/150);r=205;gg=214;b=222;al=25+90*k;break}
      }
      a[j]=r;a[j+1]=gg;a[j+2]=b;a[j+3]=al;
      if(em){g[j]=255;g[j+1]=t===LAVA?110:140;g[j+2]=40;g[j+3]=em}else g[j+3]=0;
    }
  }
  sctx.putImageData(img,0,0);gctx.putImageData(gimg,0,0);
  vctx.globalCompositeOperation='source-over';vctx.drawImage(bg,0,0);
  vctx.imageSmoothingEnabled=false;vctx.drawImage(sim,OX*dpr,OY*dpr,W*SC*dpr,H*SC*dpr);
  // resplandor: reducir y ampliar = desenfoque barato
  tctx.clearRect(0,0,tiny.width,tiny.height);tctx.imageSmoothingEnabled=true;tctx.drawImage(glow,0,0,tiny.width,tiny.height);
  vctx.globalCompositeOperation='lighter';vctx.imageSmoothingEnabled=true;vctx.globalAlpha=.9;
  vctx.drawImage(tiny,OX*dpr,OY*dpr,W*SC*dpr,H*SC*dpr);vctx.globalAlpha=1;vctx.globalCompositeOperation='source-over';
}
let last=performance.now(),acc=0;
function frame(now){acc+=Math.min(now-last,50);last=now;
  if(!paused)while(acc>=1000/60){step();acc-=1000/60}else{acc=0;for(const p of ptr.values())paint(p.x,p.y)}
  render();requestAnimationFrame(frame)}
requestAnimationFrame(frame);

/* jugar con amigos */
let sala=null,outbox=[],held=false;
function tx(d){if(sala&&sala.activo)sala.enviar(d)}
function queuePaint(x,y){if(!enSala())return;const l=outbox[outbox.length-1];if(l&&l[0]===x&&l[1]===y)return;if(outbox.length<400)outbox.push([x,y])}
setInterval(()=>{if(!enSala()){outbox=[];return}if(outbox.length){tx({p:outbox,m:sel,b:brush});outbox=[]}},50);
function rle(a){const out=[];let v=a[0],n=0;for(let i=0;i<a.length;i++){if(a[i]===v&&n<255)n++;else{out.push(v,n);v=a[i];n=1}}out.push(v,n);return new Uint8Array(out)}
function unrle(u,len){const a=new Uint8Array(len);let k=0;for(let i=0;i+1<u.length&&k<len;i+=2){a.fill(u[i],k,Math.min(len,k+u[i+1]));k+=u[i+1]}return k===len?a:null}
setInterval(()=>{if(!enSala()||!sala.lider()||sala.jugadores().length<2)return;const u=rle(type);if(u.length<60000)tx({snap:u,w:W,h:H,pause:paused})},1500);
function aplicarSnap(d){const u=d.snap instanceof Uint8Array?d.snap:new Uint8Array(d.snap||[]);if(d.w!==W||d.h!==H)return;const a=unrle(u,N);if(!a)return;
  for(let i=0;i<N;i++)if(a[i]!==type[i]){if(a[i]>12)continue;if(a[i]===E)type[i]=E;else set(i,a[i])}
  if(typeof d.pause==='boolean'&&d.pause!==paused)setPause(d.pause)}
const badge=document.createElement('div');badge.style.cssText='position:fixed;right:18px;top:64px;color:#d4d1cb;font-size:.8rem;text-shadow:0 1px 4px #000;pointer-events:none';badge.hidden=true;document.body.append(badge);
function conSala(fn){window.RatitoSala?fn(RatitoSala):addEventListener('ratitosala',()=>fn(RatitoSala),{once:true})}
let estabaEnSala=false;
conSala(S0=>{sala=S0;
  sala.al('mensaje',d=>{if(!d||typeof d!=='object')return;
    if(Array.isArray(d.p)){const m=d.m|0,b=Math.max(1,Math.min(16,d.b|0));if(m<0||m>11)return;for(const q of d.p.slice(0,400))if(Array.isArray(q)&&Number.isInteger(q[0])&&Number.isInteger(q[1]))paint(q[0],q[1],m,b,true)}
    if(d.clear){type.fill(0);life.fill(0);vel.fill(0)}
    if(typeof d.pause==='boolean'&&!d.snap)setPause(d.pause);
    if(d.snap&&!sala.lider())aplicarSnap(d)});
  sala.al('cambio',()=>{const en=enSala();if(en!==estabaEnSala){estabaEnSala=en;resize()}
    const o=sala.jugadores().filter(j=>!j.yo);badge.hidden=!en||!o.length;badge.textContent='Jugando con: '+o.map(j=>j.name).join(', ')});
});

/* escena inicial para que no empiece vacío */
(()=>{const gy=H-Math.round(H*.12);
  for(let x=0;x<W;x++){const h=Math.round(H*.07+Math.sin(x*.03)*H*.025);for(let y=H-h;y<H;y++)set(y*W+x,SAND)}
  const x0=Math.round(W*.62),x1=Math.round(W*.8),yw=Math.round(H*.55);for(let x=x0;x<x1;x++)for(let y=yw;y<yw+4;y++)set(y*W+x,WOOD);
  const s0=Math.round(W*.12),s1=Math.round(W*.34),ys=Math.round(H*.62);
  for(let x=s0;x<s1;x++)for(let y=ys;y<ys+4;y++)set(y*W+x,STONE);
  for(let y=ys-26;y<ys;y++)for(const x of [s0,s0+1,s0+2,s1-3,s1-2,s1-1])set(y*W+x,STONE);
  for(let x=s0+3;x<s1-3;x++)for(let y=ys-18;y<ys;y++)set(y*W+x,WATER);
})();
</script>
