<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Isla 3D — Ratito</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/estilo.css">
<style>
html,body{height:100%;overflow:hidden;background:#9CC3E0}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:fixed;top:14px;right:16px;text-align:right;color:#fff;pointer-events:none;text-shadow:0 1px 6px #0007}
.hud h1{margin:0;font-size:1.15rem}
.hud p{margin:2px 0 0;font-size:.8rem;max-width:250px}
.bar{position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:center;padding:12px 16px;border-radius:14px;background:#ffffffe8;box-shadow:0 6px 24px #0002;width:max-content;max-width:calc(100vw - 24px)}
.bar label{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--mut)}
.bar input[type=range]{width:120px;accent-color:#2F6E86}
#seed{font-size:.8rem;color:var(--mut);min-width:80px}
#load{position:fixed;inset:0;display:grid;place-items:center;color:#fff;font-weight:700;text-shadow:0 1px 6px #0006;pointer-events:none}
@media(max-width:560px){.hud p{display:none}.bar input[type=range]{width:90px}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<a class="volver" href="/">← Ratito</a>
<canvas id="scene" aria-label="Isla en 3D. Arrastra para girar, rueda o pellizco para acercar."></canvas>
<div id="load">Generando isla…</div>
<div class="hud"><h1>Isla 3D</h1><p>Cada isla es única. Arrastra para girar, usa la rueda o pellizca para acercarte.</p></div>
<div class="bar">
  <button class="btn" id="new">Nueva isla</button>
  <label>Mar <input type="range" id="sea" min="0" max="100" value="35"></label>
  <label>Hora <input type="range" id="hour" min="5" max="19" step="0.1" value="9.5"><span id="hourV">9:30</span></label>
  <span id="seed"></span>
</div>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {Sky} from 'three/addons/objects/Sky.js';

const canvas=document.getElementById('scene');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(2,devicePixelRatio));renderer.setSize(innerWidth,innerHeight);
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.55;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,1,30000);
camera.position.set(520,330,620);if(innerWidth<innerHeight)camera.position.multiplyScalar(1.9);
const controls=new OrbitControls(camera,canvas);controls.enableDamping=true;controls.maxPolarAngle=Math.PI*.47;controls.minDistance=120;controls.maxDistance=1800;controls.target.set(0,20,0);
controls.autoRotate=true;controls.autoRotateSpeed=.35;canvas.addEventListener('pointerdown',()=>controls.autoRotate=false);

/* cielo y luz */
const sky=new Sky();sky.scale.setScalar(20000);scene.add(sky);
const su=sky.material.uniforms;su.turbidity.value=3.5;su.rayleigh.value=2.6;su.mieCoefficient.value=.005;su.mieDirectionalG.value=.85;
const sun=new THREE.Vector3();
const dir=new THREE.DirectionalLight(0xffffff,2.2);dir.castShadow=true;dir.shadow.mapSize.set(2048,2048);
Object.assign(dir.shadow.camera,{left:-500,right:500,top:500,bottom:-500,near:10,far:3000});dir.shadow.bias=-.0006;scene.add(dir,dir.target);
const hemi=new THREE.HemisphereLight(0xbcd8f0,0x6b5a40,.7);scene.add(hemi);
scene.fog=new THREE.Fog(0xb9d3e6,1600,7000);
const pmrem=new THREE.PMREMGenerator(renderer);let envRT=null;

/* ruido */
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function makeNoise(seed){const r=mulberry(seed),p=new Uint8Array(512),g=[];for(let i=0;i<256;i++){p[i]=i;const a=r()*Math.PI*2;g.push([Math.cos(a),Math.sin(a)])}
  for(let i=255;i>0;i--){const j=r()*(i+1)|0;[p[i],p[j]]=[p[j],p[i]]}for(let i=0;i<256;i++)p[i+256]=p[i];
  const f=t=>t*t*t*(t*(t*6-15)+10);
  return(x,y)=>{const X=Math.floor(x)&255,Y=Math.floor(y)&255,xf=x-Math.floor(x),yf=y-Math.floor(y);
    const d=(h,dx,dy)=>{const v=g[h];return v[0]*dx+v[1]*dy};
    const n00=d(p[X+p[Y]],xf,yf),n10=d(p[X+1+p[Y]],xf-1,yf),n01=d(p[X+p[Y+1]],xf,yf-1),n11=d(p[X+1+p[Y+1]],xf-1,yf-1);
    const u=f(xf),v=f(yf);return (n00+(n10-n00)*u)+((n01+(n11-n01)*u)-(n00+(n10-n00)*u))*v}}

/* isla */
const SIZE=1000,SEG=220;
let terrain=null,trees=null,heights=null,noise=null,seed=0;
const water=new THREE.Mesh(new THREE.PlaneGeometry(60000,60000,1,1),new THREE.MeshPhysicalMaterial({color:0x0e3a4e,roughness:.06,metalness:0,transparent:true,opacity:.97,clearcoat:1,clearcoatRoughness:.1,envMapIntensity:.9}));
water.rotation.x=-Math.PI/2;water.receiveShadow=true;scene.add(water);
const shallow=new THREE.Mesh(new THREE.CircleGeometry(520,64),new THREE.MeshStandardMaterial({color:0x2f8f94,transparent:true,opacity:.18,roughness:.2,depthWrite:false}));
shallow.rotation.x=-Math.PI/2;
const C={deep:new THREE.Color(0x1f3a33),sand:new THREE.Color(0xcdb68a),wetSand:new THREE.Color(0x9c8a66),grass:new THREE.Color(0x587a2e),forest:new THREE.Color(0x2e4a1f),rock:new THREE.Color(0x7d746a),snow:new THREE.Color(0xf2f2ee)};
function heightAt(x,z){
  const nx=x/SIZE,nz=z/SIZE;let h=0,a=1,f=2.2;for(let o=0;o<6;o++){h+=noise(nx*f+seed*.01,nz*f-seed*.01)*a;a*=.5;f*=2.05}
  const d=Math.hypot(nx,nz)*2;const fall=1-Math.pow(Math.min(1,d/0.95),2.2);
  const ridge=1-Math.abs(noise(nx*3.1+50,nz*3.1+50));
  return (h*.75+ridge*.35+.18)*fall*260-40-Math.max(0,d-.9)*400;
}
function build(){
  seed=(Math.random()*1e6)|0;noise=makeNoise(seed);document.getElementById('seed').textContent='Isla #'+seed;
  if(terrain){scene.remove(terrain);terrain.geometry.dispose();terrain.material.dispose()}
  const geo=new THREE.PlaneGeometry(SIZE,SIZE,SEG,SEG);geo.rotateX(-Math.PI/2);
  const pos=geo.attributes.position,cols=new Float32Array(pos.count*3);heights=new Float32Array(pos.count);
  for(let i=0;i<pos.count;i++){const h=heightAt(pos.getX(i),pos.getZ(i));pos.setY(i,h);heights[i]=h}
  geo.computeVertexNormals();
  terrain=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({vertexColors:true,roughness:.95,metalness:0,envMapIntensity:.35}));
  terrain.castShadow=terrain.receiveShadow=true;scene.add(terrain);paint();placeTrees();
}
function seaLevel(){return (+document.getElementById('sea').value-35)*.9}
function paint(){
  const geo=terrain.geometry,pos=geo.attributes.position,nor=geo.attributes.normal,sea=seaLevel(),cols=new Float32Array(pos.count*3),c=new THREE.Color();
  const r=mulberry(seed+7);
  for(let i=0;i<pos.count;i++){const h=pos.getY(i)-sea,slope=1-nor.getY(i),j=(r()-.5)*.06;
    if(h<-2)c.copy(C.wetSand).lerp(C.deep,Math.min(1,-h/40));
    else if(h<6)c.copy(C.sand);
    else if(h<10)c.copy(C.sand).lerp(C.grass,(h-6)/4);
    else if(h<70)c.copy(C.grass).lerp(C.forest,Math.min(1,(h-10)/40));
    else if(h<150)c.copy(C.forest).lerp(C.rock,Math.min(1,(h-70)/50));
    else c.copy(C.rock).lerp(C.snow,Math.min(1,(h-150)/40));
    if(slope>.35&&h>8)c.lerp(C.rock,Math.min(1,(slope-.35)*2.2));
    cols[i*3]=c.r+j;cols[i*3+1]=c.g+j;cols[i*3+2]=c.b+j*.6}
  geo.setAttribute('color',new THREE.BufferAttribute(cols,3));
  water.position.y=sea;shallow.position.y=sea+.4;
}
function placeTrees(){
  if(trees){trees.forEach(t=>{scene.remove(t);t.geometry.dispose();t.material.dispose();t.dispose()})}
  const sea=seaLevel(),r=mulberry(seed+3),spots=[];
  for(let k=0;k<9000&&spots.length<1400;k++){const x=(r()-.5)*SIZE*.95,z=(r()-.5)*SIZE*.95,h=heightAt(x,z)-sea;
    if(h<12||h>120)continue;const e=1.5,s=(heightAt(x+e,z)-heightAt(x-e,z))**2+(heightAt(x,z+e)-heightAt(x,z-e))**2;if(s>9)continue;
    if(noise(x/120+9,z/120+9)<-.05)continue;spots.push([x,h+sea,z,.7+r()*.8,r()*Math.PI])}
  const trunkG=new THREE.CylinderGeometry(.6,.9,6,5),crownG=new THREE.ConeGeometry(4.2,13,7);trunkG.translate(0,3,0);crownG.translate(0,11,0);
  const trunk=new THREE.InstancedMesh(trunkG,new THREE.MeshStandardMaterial({color:0x3b2c1f,roughness:1,envMapIntensity:.3}),spots.length);
  const crown=new THREE.InstancedMesh(crownG,new THREE.MeshStandardMaterial({color:0xffffff,roughness:.95,envMapIntensity:.3}),spots.length);
  const m=new THREE.Matrix4(),q=new THREE.Quaternion(),s=new THREE.Vector3(),p=new THREE.Vector3(),col=new THREE.Color();
  spots.forEach(([x,y,z,sc,rot],i)=>{q.setFromAxisAngle(new THREE.Vector3(0,1,0),rot);s.set(sc,sc*(.9+r()*.4),sc);p.set(x,y-.5,z);m.compose(p,q,s);trunk.setMatrixAt(i,m);crown.setMatrixAt(i,m);
    col.setHSL(.27+r()*.06,.38+r()*.15,.11+r()*.06);crown.setColorAt(i,col)});
  trunk.castShadow=crown.castShadow=true;crown.receiveShadow=true;scene.add(trunk,crown);trees=[trunk,crown];
}
function setHour(h){
  const t=(h-12)/7,elev=72*Math.sin(Math.PI*(h-6)/12),az=180+t*95;
  const phi=THREE.MathUtils.degToRad(90-elev),theta=THREE.MathUtils.degToRad(az);sun.setFromSphericalCoords(1,phi,theta);
  su.sunPosition.value.copy(sun);dir.position.copy(sun).multiplyScalar(1500);
  const low=Math.max(0,1-elev/25);dir.color.setRGB(1,1-.35*low,1-.6*low);dir.intensity=elev<0?0:2.4*Math.min(1,elev/8+.15);
  hemi.intensity=.42+.4*Math.min(1,Math.max(0,elev)/30);
  scene.fog.color.setRGB(.73-.25*low,.83-.35*low,.9-.45*low);
  renderer.toneMappingExposure=.4+.1*Math.min(1,Math.max(0,elev)/30);
  if(envRT)envRT.dispose();envRT=pmrem.fromScene(sky);scene.environment=envRT.texture;
  const hh=Math.floor(h),mm=Math.round((h-hh)*60);document.getElementById('hourV').textContent=`${hh}:${String(mm%60).padStart(2,'0')}`;
}
document.getElementById('new').onclick=()=>{build()};
document.getElementById('sea').oninput=()=>{paint()};
document.getElementById('sea').onchange=()=>placeTrees();
document.getElementById('hour').oninput=e=>setHour(+e.target.value);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
build();setHour(9.5);document.getElementById('load').remove();
const clock=new THREE.Clock();
renderer.setAnimationLoop(()=>{const t=clock.getElapsedTime();water.material.clearcoatRoughness=.08+.04*Math.sin(t*.8);controls.update();renderer.render(scene,camera)});
</script>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js" defer></script>
<script src="/amigos.js" defer></script>
</body>
</html>
