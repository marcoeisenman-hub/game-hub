const RONDAS=5,R=6371;
const svg=d3.select('#map'),g=svg.append('g'),q=document.getElementById('q'),nr=document.getElementById('nr'),pista=document.getElementById('pista');
const ok=document.getElementById('ok'),sig=document.getElementById('sig'),res=document.getElementById('res'),tabla=document.getElementById('tabla');
let proj,path,W,H,mundo,pin=null,k=1,lista=[];
const nf=new Intl.NumberFormat('es');
function km(a,b){const t=Math.PI/180,dl=(b[0]-a[0])*t,dn=(b[1]-a[1])*t,x=Math.sin(dl/2)**2+Math.cos(a[0]*t)*Math.cos(b[0]*t)*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.min(1,Math.sqrt(x)))}
const puntos=d=>Math.round(5000*Math.exp(-d/1800));
function actOtra(){const b=document.getElementById('otra');b.disabled=!P.mando;b.textContent=P.mando?'Jugar otra vez':'El líder empieza otra'}
const P=Partida({rondas:RONDAS,alCambiar:t=>{try{actOtra()}catch(e){}if(t==='partida'){armar();pin=null}if(t==='ronda')pin=null;pintar()}});
function armar(){let todos=LUGARES.map((_,i)=>i);
  let sala=false;try{sala=!!sessionStorage.getItem('ratitoSala')||!!(window.RatitoSala&&RatitoSala.codigo)}catch(e){}
  if(!P.enSala&&!sala){let vistos=[];try{vistos=JSON.parse(localStorage.getItem('gamehubMapaVistos')||'[]')}catch(e){}if(!Array.isArray(vistos))vistos=[];
    const libres=todos.filter(i=>!vistos.includes(i));if(libres.length>=RONDAS)todos=libres;
    lista=barajar(todos,azar(P.seed)).slice(0,RONDAS);vistos=vistos.concat(lista).slice(-Math.floor(LUGARES.length*.7));try{localStorage.setItem('gamehubMapaVistos',JSON.stringify(vistos))}catch(e){}return}
  lista=barajar(todos,azar(P.seed)).slice(0,RONDAS)}
function lugar(){return LUGARES[lista[P.ronda]]}
function size(){W=innerWidth;H=innerHeight;svg.attr('viewBox',[0,0,W,H]);
  proj=d3.geoNaturalEarth1().fitExtent([[10,150],[W-10,H-80]],{type:'Sphere'});path=d3.geoPath(proj);
  g.selectAll('*').remove();g.append('path').attr('class','sphere').attr('d',path({type:'Sphere'}));
  g.append('path').attr('class','grat').attr('d',path(d3.geoGraticule10()));
  if(mundo)g.append('g').selectAll('path').data(mundo.features).join('path').attr('class','land').attr('d',path);
  g.append('g').attr('id','marcas');pintar()}
const zoom=d3.zoom().scaleExtent([1,14]).on('zoom',e=>{g.attr('transform',e.transform);k=e.transform.k;pintar()});
svg.call(zoom).on('dblclick.zoom',null);
document.getElementById('zin').onclick=()=>svg.transition().duration(250).call(zoom.scaleBy,1.8);
document.getElementById('zout').onclick=()=>svg.transition().duration(250).call(zoom.scaleBy,1/1.8);
let down=null;
svg.on('pointerdown',e=>{down=[e.clientX,e.clientY]}).on('pointerup',e=>{if(!down||Math.hypot(e.clientX-down[0],e.clientY-down[1])>6||P.mia())return;
  const t=d3.zoomTransform(svg.node()),[x,y]=t.invert([e.clientX,e.clientY]),ll=proj.invert([x,y]);if(!ll||!isFinite(ll[0]))return;
  const back=proj(ll);if(!back||Math.hypot(back[0]-x,back[1]-y)>2)return;// fuera del mapa
  pin=[ll[1],ll[0]];pintar()});
function marca(sel,lat,lon,color,txt,grande){const [x,y]=proj([lon,lat]),s=1/k;
  const m=sel.append('g').attr('transform',`translate(${x},${y}) scale(${s})`);
  m.append('circle').attr('r',grande?8:6).attr('fill',color).attr('stroke','#fff').attr('stroke-width',2.5);
  if(txt)m.append('text').attr('x',11).attr('y',4).attr('font-size',13).attr('font-weight',700).attr('fill',color).attr('stroke','#fff').attr('stroke-width',3.5).attr('paint-order','stroke').text(txt)}
function pintar(){
  if(!lista.length)armar();
  const L=lugar(),m=d3.select('#marcas');if(!m.node())return;m.selectAll('*').remove();
  nr.textContent=`Ronda ${P.ronda+1} de ${RONDAS}`+(P.enSala?' · con amigos':'');q.textContent='¿Dónde queda '+L[0]+'?';
  const mia=P.mia(),real=[L[2],L[3]];
  if(!mia){pista.textContent=L[1]+'. Toca el mapa y confirma.';res.hidden=true;sig.hidden=true;ok.hidden=false;ok.disabled=!pin;
    if(pin)marca(m,pin[0],pin[1],'#15171C','Tú');}
  else{ok.hidden=true;pista.textContent=L[1]+'.';
    const rs=P.respuestas();
    for(const id in rs){const x=rs[id];m.append('path').attr('d',path({type:'LineString',coordinates:[[x.d.lon,x.d.lat],[L[3],L[2]]]})).attr('fill','none').attr('stroke',x.yo?'#15171C':x.color).attr('stroke-width',1.6).attr('stroke-dasharray','5 5').attr('vector-effect','non-scaling-stroke');}
    for(const id in rs){const x=rs[id];marca(m,x.d.lat,x.d.lon,x.yo?'#15171C':x.color,x.yo?'Tú':x.name)}
    marca(m,real[0],real[1],'#E4572E',L[0],true);
    res.hidden=false;res.innerHTML=`${nf.format(Math.round(mia.km))} km · <span>${nf.format(mia.pts)} pts</span>`;
    const ult=P.ronda>=RONDAS-1,faltan=P.jugadores().filter(j=>!P.respuestas()[j.id]);
    sig.hidden=false;
    if(faltan.length&&P.enSala){sig.disabled=true;sig.textContent='Esperando a '+faltan.map(j=>j.name).join(', ')}
    else if(!P.mando){sig.disabled=true;sig.textContent=ult?'Fin: mira el resultado':'Esperando a '+P.lider().name}
    else{sig.disabled=false;sig.textContent=ult?'Ver resultado':'Siguiente lugar'}
    if(ult&&!faltan.length&&!P.mando)fin();
  }
  tablaPts()}
function tablaPts(){if(!P.enSala){tabla.hidden=true;return}const t=P.puntos();tabla.hidden=false;
  tabla.innerHTML='<strong>Puntos</strong>'+P.jugadores().map(j=>({...j,p:t[j.id]||0,ya:!!P.respuestas()[j.id]})).sort((a,b)=>b.p-a.p).map(j=>`<div><i style="background:${j.color}"></i>${j.name}${j.yo?' (tú)':''} ${j.ya?'':'<em>pensando…</em>'}<b>${nf.format(j.p)}</b></div>`).join('')}
ok.onclick=()=>{if(!pin)return;const L=lugar(),d=km(pin,[L[2],L[3]]);P.responder({lat:+pin[0].toFixed(3),lon:+pin[1].toFixed(3),km:Math.round(d),pts:puntos(d)})};
sig.onclick=()=>{if(P.ronda>=RONDAS-1)return fin();P.siguiente()};
function fin(){const t=P.puntos(),me=P.jugadores().find(j=>j.yo)||{id:'yo'},tot=t[me.id]||0;
  document.getElementById('ftot').textContent=nf.format(tot);
  document.getElementById('fmsg').textContent=tot>=20000?'Tienes un GPS en la cabeza.':tot>=14000?'Muy buena geografía.':tot>=8000?'Nada mal.':'El mundo es grande. Otra vez.';
  document.getElementById('frank').innerHTML=P.enSala?P.jugadores().map(j=>({...j,p:t[j.id]||0})).sort((a,b)=>b.p-a.p).map(j=>`<li>${j.name}${j.yo?' (tú)':''}: ${nf.format(j.p)}</li>`).join(''):'';
  const b=document.getElementById('otra');b.disabled=!P.mando;b.textContent=P.mando?'Jugar otra vez':'El líder empieza otra';
  document.getElementById('fin').hidden=false}
document.getElementById('otra').onclick=()=>{document.getElementById('fin').hidden=true;P.otraVez()};
const ofin=()=>{if(P.ronda===0&&!P.mia())document.getElementById('fin').hidden=true};
setInterval(ofin,500);
addEventListener('resize',size);
fetch('/lib/countries-110m.json').then(r=>r.json()).then(t=>{mundo=topojson.feature(t,t.objects.countries);size()}).catch(()=>{q.textContent='No se pudo cargar el mapa. Recarga la página.'});
size();
</script>
