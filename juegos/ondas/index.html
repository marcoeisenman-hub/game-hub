<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ondas — Ratito</title><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/estilo.css"><style>
html,body{height:100%;overflow:hidden;background:#516d66}#agua{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}.panel{position:fixed;bottom:max(20px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(440px,calc(100% - 28px));padding:16px 20px;border:1px solid #ffffff60;border-radius:18px;background:#f9faf4e8;box-shadow:0 8px 40px #152c2925;backdrop-filter:blur(16px)}.fila{display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:24px;margin:0;font-weight:700;letter-spacing:-1px}.panel p{margin:5px 0 0;color:var(--mut);font-size:13px}.btn{font-size:13px;padding:9px 14px}#lluvia[aria-pressed=true]{background:#34695f;color:white}.nota{position:fixed;top:76px;right:20px;color:#f4f8ebc9;font-size:11px;letter-spacing:2px;text-transform:uppercase;pointer-events:none}
</style></head><body><a class="volver" href="/">← Ratito</a><canvas id="agua" aria-label="Agua interactiva: toca o arrastra para crear ondas"></canvas><section class="panel"><div class="fila"><h1>Ondas</h1><button class="btn sec" id="lluvia" aria-pressed="false">Activar lluvia</button></div><p>Toca el agua. Arrastra despacio y mira cómo se cruzan las ondas.</p></section>
<script>
'use strict';
const canvas=document.getElementById('agua'),ctx=canvas.getContext('2d',{alpha:false}),small=document.createElement('canvas'),sc=small.getContext('2d',{alpha:false});
let w,h,a,b,bed,frame,rain=false,last=0,acc=0;const pointers=new Map();
let sala=null;
const juntos=document.createElement('div');juntos.style.cssText='position:fixed;right:14px;top:118px;max-width:calc(100% - 28px);font:12px sans-serif;background:#fffffff0;padding:7px 10px;border-radius:10px;z-index:5;pointer-events:none;overflow-wrap:anywhere';juntos.hidden=true;document.body.append(juntos);
function conectado(){return sala&&sala.activo}
function indicador(){juntos.hidden=!conectado();juntos.textContent=conectado()?'Jugando con: '+sala.jugadores().filter(p=>!p.yo).map(p=>p.name).join(', '):''}
function conSala(fn){window.RatitoSala?fn(window.RatitoSala):addEventListener('ratitosala',()=>fn(window.RatitoSala),{once:true})}

let gotas=[],anillos=[];
function toque(x,y,f,r=3,persona){drop(x*w,y*h,f,r);if(persona&&f>1)anillos.push({x,y,color:persona.color,t:performance.now()});}
function emitir(x,y,f,r=3){if(conectado()&&gotas.length>=192)return;toque(x,y,f,r,conectado()&&r!==2?sala.yo:null);if(conectado())gotas.push({x,y,f,r});}

function resize(){const reduction=Math.max(3,Math.sqrt(innerWidth*innerHeight/170000)),nw=Math.max(100,Math.round(innerWidth/reduction)),nh=Math.max(100,Math.round(innerHeight/reduction));canvas.width=innerWidth;canvas.height=innerHeight;if(a&&nw===w&&Math.abs(nh-h)<20)return;w=nw;h=nh;small.width=w;small.height=h;a=new Float32Array(w*h);b=new Float32Array(w*h);
const bg=document.createElement('canvas');bg.width=w;bg.height=h;const c=bg.getContext('2d');c.fillStyle='#817f6c';c.fillRect(0,0,w,h);
// Overlapping river pebbles, each with an irregular outline and soft cast shadow.
for(let i=0;i<w*h/55;i++){const x=Math.random()*w,y=Math.random()*h,r=3+Math.random()*9,tone=90+Math.random()*85,beige=Math.random()*16;c.save();c.translate(x,y);c.rotate(Math.random()*Math.PI);c.scale(1,.6+Math.random()*.5);c.beginPath();for(let j=0;j<10;j++){let t=j*Math.PI/5,rr=r*(.85+Math.random()*.22);j?c.lineTo(Math.cos(t)*rr,Math.sin(t)*rr):c.moveTo(Math.cos(t)*rr,Math.sin(t)*rr)}c.closePath();let g=c.createRadialGradient(-r*.3,-r*.4,0,0,0,r);g.addColorStop(0,`rgb(${tone+22},${tone+18},${tone+7-beige})`);g.addColorStop(1,`rgb(${tone-25},${tone-27},${tone-30-beige})`);c.fillStyle=g;c.shadowColor='#20291c99';c.shadowBlur=2;c.shadowOffsetY=1.5;c.fill();c.shadowColor='transparent';c.strokeStyle='#ece4c32a';c.lineWidth=.4;c.stroke();c.restore()}
const pixels=c.getImageData(0,0,w,h);for(let i=0;i<pixels.data.length;i+=4){const n=(Math.random()-.5)*13;pixels.data[i]+=n;pixels.data[i+1]+=n;pixels.data[i+2]+=n}bed=pixels.data;frame=sc.createImageData(w,h);drop(w*.5,h*.4,4,3)}
function drop(x,y,power=3,r=3){x=Math.round(x);y=Math.round(y);for(let yy=-r;yy<=r;yy++)for(let xx=-r;xx<=r;xx++){const d=Math.hypot(xx,yy);if(d<r&&x+xx>0&&x+xx<w-1&&y+yy>0&&y+yy<h-1){const i=(y+yy)*w+x+xx;a[i]=Math.min(12,a[i]+power*(1+Math.cos(d/r*Math.PI))*.5)}}}
function step(){for(let y=0;y<h;y++){const row=y*w;for(let x=0;x<w;x++){const i=row+x;b[i]=((a[row+Math.max(0,x-1)]+a[row+Math.min(w-1,x+1)]+a[Math.max(0,y-1)*w+x]+a[Math.min(h-1,y+1)*w+x])*.5-b[i])*.991}}[a,b]=[b,a]}
function draw(t){if(!last)last=t;acc+=Math.min(t-last,50);last=t;while(acc>=1000/60){if(rain&&(!conectado()||sala.lider())&&Math.random()<.22)emitir(Math.random(),Math.random(),2+Math.random()*2,2);for(const p of pointers.values())emitir(p.x/w,p.y/h,.18,3);step();acc-=1000/60}
const out=frame.data;for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=y*w+x,dx=a[y*w+Math.min(w-1,x+1)]-a[y*w+Math.max(0,x-1)],dy=a[Math.min(h-1,y+1)*w+x]-a[Math.max(0,y-1)*w+x];const sx=Math.max(0,Math.min(w-1,Math.round(x+dx*2.8))),sy=Math.max(0,Math.min(h-1,Math.round(y+dy*2.8))),s=(sy*w+sx)*4,o=i*4;const light=Math.max(0,Math.min(1,(dx*-0.4+dy*-0.65)/Math.sqrt(1+dx*dx+dy*dy)+.48)),spec=Math.pow(light,18)*210,shade=1+Math.max(-.25,Math.min(.25,(dx+dy)*.065));out[o]=bed[s]*.77*shade+spec;out[o+1]=bed[s+1]*.93*shade+spec+9;out[o+2]=bed[s+2]*.94*shade+spec+12;out[o+3]=255}sc.putImageData(frame,0,0);ctx.drawImage(small,0,0,canvas.width,canvas.height);anillos=anillos.filter(p=>t-p.t<450);for(const p of anillos){ctx.strokeStyle=p.color;ctx.globalAlpha=1-(t-p.t)/450;ctx.lineWidth=2;ctx.beginPath();ctx.arc(p.x*canvas.width,p.y*canvas.height,8+(t-p.t)/22,0,Math.PI*2);ctx.stroke()}ctx.globalAlpha=1;requestAnimationFrame(draw)}
function position(e){return{x:e.clientX/innerWidth*w,y:e.clientY/innerHeight*h}}canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);const p=position(e);pointers.set(e.pointerId,p);emitir(p.x/w,p.y/h,7,4)});canvas.addEventListener('pointermove',e=>{const old=pointers.get(e.pointerId);if(!old)return;const p=position(e),steps=Math.min(32,Math.max(1,Math.ceil(Math.hypot(p.x-old.x,p.y-old.y)/2)));for(let i=1;i<=steps;i++)emitir((old.x+(p.x-old.x)*i/steps)/w,(old.y+(p.y-old.y)*i/steps)/h,1.3,3);pointers.set(e.pointerId,p)});for(const name of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(name,e=>pointers.delete(e.pointerId));document.getElementById('lluvia').onclick=e=>{if(conectado()){if(sala.lider()){setRain(!rain);sala.enviar({tipo:'lluvia',rain})}else sala.enviar({tipo:'pedirLluvia',rain:!rain})}else setRain(!rain)};addEventListener('resize',()=>{pointers.clear();resize()});resize();requestAnimationFrame(draw);

function setRain(value){rain=!!value;const b=document.getElementById('lluvia');b.setAttribute('aria-pressed',rain);b.textContent=rain?'Detener lluvia':'Activar lluvia'}
setInterval(()=>{if(conectado()&&gotas.length)sala.enviar({tipo:'gotas',gotas:gotas.splice(0,96)});else gotas=[]},70);
conSala(api=>{sala=api;let anterior=null;function cambio(){const lid=conectado()?sala.jugadores()[0]?.id:null;if(anterior===sala.yo.id&&lid&&lid!==anterior)sala.enviar({tipo:'traspasoLluvia',para:lid,rain});anterior=lid;indicador();gotas=[];if(conectado()&&sala.lider())sala.enviar({tipo:'lluvia',rain})}sala.al('cambio',cambio);sala.al('mensaje',(d,de)=>{if(!d)return;if(d.tipo==='traspasoLluvia'&&d.para===sala.yo.id&&sala.lider()){setRain(d.rain);sala.enviar({tipo:'lluvia',rain})}if(d.tipo==='gotas'&&Array.isArray(d.gotas))for(const p of d.gotas.slice(0,1000))if([p.x,p.y,p.f].every(Number.isFinite))toque(Math.max(0,Math.min(1,p.x)),Math.max(0,Math.min(1,p.y)),Math.max(0,Math.min(7,p.f)),p.r===4?4:p.r===2?2:3,p.r===2?null:de);if(d.tipo==='lluvia'&&de.id===sala.jugadores()[0]?.id)setRain(d.rain);if(d.tipo==='pedirLluvia'&&sala.lider()){setRain(d.rain);sala.enviar({tipo:'lluvia',rain})}});cambio()});
</script><script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js" defer></script><script src="/amigos.js" defer></script></body></html>
