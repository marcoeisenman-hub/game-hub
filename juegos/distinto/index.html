<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Distinto — game.hub</title><link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="game.hub"><link rel="stylesheet" href="/estilo.css">
<style>
body{background:#fff}
main{max-width:540px;margin:70px auto 40px;padding:0 16px}
h1{font-size:clamp(34px,8vw,54px);letter-spacing:-.05em;margin:0}
.sub{color:var(--mut);margin:2px 0 0}
.top{display:flex;justify-content:space-between;align-items:center;font-weight:800;margin:4px 0 8px}
.top b{font-size:1.4rem}
.tablero{position:relative;aspect-ratio:1;width:100%;border:2px solid var(--ink);border-radius:20px;padding:8px;background:#15171C;display:grid;gap:6px;touch-action:manipulation}
.tablero button{border:0;border-radius:10px;cursor:pointer;padding:0;touch-action:manipulation}
.tablero button.era{outline:4px solid #fff;outline-offset:-4px;animation:era .6s infinite alternate}
@keyframes era{to{transform:scale(.9)}}
.tablero.mal{animation:mal .35s}
@keyframes mal{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.bloqueo{position:absolute;inset:0;display:grid;place-items:center;background:#E63946cc;color:#fff;font-weight:900;font-size:1.6rem;border-radius:18px}
.espera{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#fff;font-weight:800;padding:20px}
.nota{color:var(--mut);font-size:.9rem}
</style></head><body><a class="volver" href="/">← game.hub</a>
<main>
  <h1>Distinto</h1><p class="sub">Uno de los cuadros es de otro color. Encuéntralo rápido.</p>
  <div id="carrera"></div>
  <div class="top"><span>Encontrados: <b id="pts">0</b></span><span id="tam"></span></div>
  <div class="tablero" id="tab"><div class="espera">Dale a Empezar</div></div>
  <p class="nota">40 segundos. Cada vez hay más cuadros y la diferencia es más chiquita. Si te equivocas pierdes 1 segundo.</p>
</main>
<script src="/carrera.js"></script>
<script>
'use strict';
const $=id=>document.getElementById(id);
let rand=Math.random,puntos=0,correcto=-1,bloq=0;
function nivel(){const k=puntos;const lado=Math.min(9,2+Math.floor(k/3));const dif=Math.max(5,26-k*.9);return{lado,dif}}
function nueva(){const {lado,dif}=nivel(),tot=lado*lado;
  const h=Math.floor(rand()*360),s=55+Math.floor(rand()*30),l=42+Math.floor(rand()*18),sig=rand()<.5?-1:1;
  correcto=Math.floor(rand()*tot);
  const tab=$('tab');tab.style.gridTemplateColumns=`repeat(${lado},1fr)`;
  const base=`hsl(${h} ${s}% ${l}%)`,otro=`hsl(${h} ${s}% ${Math.max(8,Math.min(92,l+sig*dif))}%)`;
  let html='';for(let i=0;i<tot;i++)html+=`<button type="button" data-i="${i}" style="background:${i===correcto?otro:base}" aria-label="Cuadro ${i+1}"></button>`;
  tab.innerHTML=html;$('tam').textContent=lado+'×'+lado;$('pts').textContent=puntos}
$('tab').addEventListener('pointerdown',e=>{const b=e.target.closest('button[data-i]');if(!b||!c.jugando||Date.now()<bloq)return;e.preventDefault();
  if(+b.dataset.i===correcto){puntos++;c.progreso(puntos,30);nueva()}
  else{bloq=Date.now()+1000;const t=$('tab');t.classList.remove('mal');void t.offsetWidth;t.classList.add('mal');
    const m=document.createElement('div');m.className='bloqueo';m.textContent='¡Ese no! −1 s';t.append(m);setTimeout(()=>m.remove(),1000)}});
function mostrar(){const b=$('tab').querySelector(`button[data-i="${correcto}"]`);if(b)b.classList.add('era')}
const c=Carrera({app:'distinto',el:$('carrera'),limite:40000,mejor:'alto',formato:v=>v+(v===1?' encontrado':' encontrados'),
  alEmpezar:r=>{rand=r;puntos=0;bloq=0;nueva();c.progreso(0,30)},
  alAcabarTiempo:()=>{c.terminar(puntos);mostrar()}});
</script>
<script src="/lib/peerjs.min.js" defer></script><script src="/amigos.js" defer></script>
</body></html>
