<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>¿Cuántos? — game.hub</title><link rel="icon" href="/favicon.svg?v=3" type="image/svg+xml"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="manifest" href="/manifest.webmanifest"><meta name="apple-mobile-web-app-title" content="game.hub"><link rel="stylesheet" href="/estilo.css"><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{background:#fff;color:#15171C}main{max-width:720px;margin:76px auto 24px;padding:0 16px;user-select:none;-webkit-user-select:none}h1{font-size:clamp(36px,8vw,58px);letter-spacing:-.04em;margin:0}p{line-height:1.5}button{font:inherit;touch-action:none;color:#15171C}#estado{min-height:28px;font-weight:700}.meta{display:flex;justify-content:space-between;font-weight:900;margin:14px 0}#campo{position:relative;border:2px solid #15171C;border-radius:18px;overflow:hidden;touch-action:none}button:focus-visible{outline:4px solid #2D6CDF;outline-offset:2px}#campo{height:clamp(190px,32svh,290px);background:#EEF6FF}.figura{position:absolute;width:var(--tam);height:var(--tam);background:var(--color);border:2px solid #15171C;border-radius:50%;transform:translate(-50%,-50%)}.figura.cuadro{border-radius:3px}.oculto{display:grid;place-items:center;height:100%;font-size:48px;font-weight:900}#respuesta{min-height:54px;margin:10px 0;border:2px solid #15171C;border-radius:12px;text-align:center;font-size:36px;font-weight:900}#respuesta:empty::after{content:'?';color:#999}.teclas{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;max-width:430px;margin:auto}.teclas button{background:#fff;border:2px solid #15171C;border-radius:12px;padding:10px;font-weight:900;font-size:24px;cursor:pointer}.teclas button:active{background:#F5B700}.teclas button:disabled{opacity:.4}.teclas .ok{grid-column:1/-1;background:#1E9E6A;color:#fff}main>p{margin:8px 0}@media(max-height:740px){main{margin-top:60px}#campo{height:180px}.teclas button{padding:6px}h1{font-size:36px}}</style></head><body><a class="volver" href="/">← game.hub</a><main><h1>¿Cuántos?</h1><p>Diez vistazos de 1,2 segundos. Estima cuántas figuras viste: cuanto más cerca, más puntos. Tienes 60 segundos.</p><div id="carrera"></div><div class="meta"><span id="ronda">Ronda 1 / 10</span><span id="puntos">0 pts</span></div><div id="campo" aria-label="Figuras para estimar"><div class="oculto">?</div></div><div id="respuesta" role="status" aria-label="Tu respuesta"></div><div class="teclas" id="teclas"></div><p id="estado" role="status">Pulsa Empezar y prepara la vista.</p></main><script src="/carrera.js"></script><script>
'use strict';

// Efectos locales: solo presentación; no consumen el azar de Carrera.
const jugo={
 audio:null,
 nota(f=660,n=1){try{if(window.GameHubFx?.silencio?.()||localStorage.getItem('gamehubSilencio')==='1')return;const A=window.AudioContext||window.webkitAudioContext;if(!A)return;const a=this.audio||(this.audio=new A());a.resume().catch(()=>{});for(let i=0;i<n;i++){const t=a.currentTime+i*.065,o=a.createOscillator(),g=a.createGain();o.type='triangle';o.frequency.value=f*Math.pow(1.25,i);g.gain.setValueAtTime(.035,t);g.gain.exponentialRampToValueAtTime(.001,t+.12);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+.13)}}catch{}},
 mover(el,mal=false){el?.animate(mal?[{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'translateX(0)'}]:[{transform:'scale(.94)'},{transform:'scale(1.04)'},{transform:'scale(1)'}],{duration:280})},
 flotar(el,txt,color='#1E9E6A'){if(!el)return;const r=el.getBoundingClientRect(),p=document.createElement('span');p.textContent=txt;Object.assign(p.style,{position:'fixed',left:Math.max(8,Math.min(innerWidth-85,r.left+r.width/2-30))+'px',top:Math.max(10,r.top)+'px',font:'900 24px system-ui',color,pointerEvents:'none',zIndex:100});document.body.append(p);p.animate([{opacity:1,transform:'translateY(0)'},{opacity:0,transform:'translateY(-65px)'}],{duration:750}).onfinish=()=>p.remove()},
 chispas(el,color='#F5B700',n=12){if(!el)return;const r=el.getBoundingClientRect(),capa=document.createElement('div');Object.assign(capa.style,{position:'fixed',inset:'0',overflow:'hidden',pointerEvents:'none',zIndex:99});document.body.append(capa);setTimeout(()=>capa.remove(),650);for(let i=0;i<n;i++){const p=document.createElement('i');Object.assign(p.style,{position:'fixed',left:(r.left+r.width/2)+'px',top:(r.top+r.height/2)+'px',width:'6px',height:'6px',borderRadius:'2px',background:color,pointerEvents:'none',zIndex:99});capa.append(p);const a=i/n*Math.PI*2;p.animate([{opacity:1,transform:'translate(0,0)'},{opacity:0,transform:`translate(${Math.cos(a)*55}px,${Math.sin(a)*55}px)`}],{duration:550}).onfinish=()=>p.remove()}},
 numero(el,v,suf=''){const t=performance.now();function f(now){if(!el.isConnected)return;const q=Math.min(1,(now-t)/400);el.textContent=Math.round(v*(1-Math.pow(1-q,3)))+suf;if(q<1)requestAnimationFrame(f)}requestAnimationFrame(f)}
};

const $=id=>document.getElementById(id),colores=['#2D6CDF','#E63946','#F5B700','#1E9E6A','#6C4BD8','#F28C28'];
let planes=[],indice=0,total=0,escrito='',acepta=false,version=0,timer=0;
function bloquear(){acepta=false;for(const b of $('teclas').children)b.disabled=true}
function siguiente(){bloquear();escrito='';$('respuesta').textContent='';$('ronda').textContent='Ronda '+(indice+1)+' / 10';$('estado').textContent='¡Mira!';$('campo').replaceChildren();
 const p=planes[indice],token=++version;
 for(const f of p.figuras){const e=document.createElement('span');e.className='figura'+(f.cuadro?' cuadro':'');e.style.cssText='left:'+f.x+'%;top:'+f.y+'%;--tam:'+f.tam+'px;--color:'+f.color;$('campo').append(e)}
 timer=setTimeout(()=>{if(token!==version||!c.jugando)return;$('campo').innerHTML='<div class="oculto">?</div>';$('estado').textContent='¿Cuántas había? Escribe y pulsa OK.';acepta=true;for(const b of $('teclas').children)b.disabled=false},1200)}
function tecla(k){if(!acepta||!c.jugando)return;
 if(k==='OK'){if(!escrito)return;bloquear();const real=planes[indice].real,r=Number(escrito),pts=r===0?0:Math.round(100*Math.exp(-2.3*Math.abs(Math.log(r/real))));total+=pts;c.progreso(total,1000);$('puntos').textContent=total+' pts';$('campo').innerHTML='<div class="oculto" style="font-size:clamp(24px,6vw,42px)"><span id="realFx"></span> / <span id="estimaFx"></span><small style="display:block;font-size:14px">Real / tu estimación</small></div>';jugo.numero($('realFx'),real);jugo.numero($('estimaFx'),r);if(r===real){jugo.chispas($('campo'));jugo.nota(660,3)}$('estado').textContent='Había '+real+'. Tu estimación: '+r+' → +'+pts+' pts.';indice++;const token=version;timer=setTimeout(()=>{if(token!==version||!c.jugando)return;if(indice===10)finalizar('¡Diez rondas completadas!');else siguiente()},1100);return}
 if(k==='⌫')escrito=escrito.slice(0,-1);else if(k==='C')escrito='';else if(escrito.length<3)escrito+=k;$('respuesta').textContent=escrito;
}
$('teclas').innerHTML=['7','8','9','4','5','6','1','2','3','C','0','⌫','OK'].map(k=>'<button type="button" data-k="'+k+'"'+(k==='OK'?' class="ok"':'')+' aria-label="'+(k==='⌫'?'Borrar':k==='C'?'Limpiar':k==='OK'?'Confirmar respuesta':k)+'">'+k+'</button>').join('');
$('teclas').addEventListener('click',e=>{const b=e.target.closest('button');if(b&&!b.disabled)tecla(b.dataset.k)});
addEventListener('keydown',e=>{if(e.target.closest&&e.target.closest('input,textarea,[contenteditable=true]'))return;let k=/^[0-9]$/.test(e.key)?e.key:e.key==='Enter'?'OK':e.key==='Backspace'?'⌫':e.key==='Escape'?'C':null;if(k&&acepta&&c.jugando){e.preventDefault();if(!e.repeat)tecla(k)}});
function finalizar(txt){version++;clearTimeout(timer);bloquear();$('estado').textContent=txt+' Total: '+total+' pts.';c.terminar(total)}
const c=Carrera({app:'cuantos',maxValor:1000,el:$('carrera'),limite:60000,mejor:'alto',formato:v=>v+' pts',
 alEmpezar(rand){version++;clearTimeout(timer);indice=0;total=0;$('puntos').textContent='0 pts';let previo=7;planes=Array.from({length:10},(_,i)=>{const minimo=previo+1,maximo=Math.min(120-(9-i),30+i*10);const real=minimo+Math.floor(rand()*(maximo-minimo+1));previo=real;const celdas=Array.from({length:130},(_,j)=>j);for(let j=celdas.length-1;j>0;j--){const k=Math.floor(rand()*(j+1));[celdas[j],celdas[k]]=[celdas[k],celdas[j]]}return{real,figuras:celdas.slice(0,real).map(pos=>({x:4+(pos%13)*7.65+(rand()-.5)*1.5,y:6+Math.floor(pos/13)*9.6+(rand()-.5)*2,tam:10+Math.floor(rand()*5),color:colores[Math.floor(rand()*colores.length)],cuadro:rand()<.35}))}});c.progreso(0,1000);siguiente()},
 alAcabarTiempo(){finalizar('¡Tiempo!')},alCerrar(){version++;clearTimeout(timer);bloquear()}
});bloquear();

</script><script src="/lib/peerjs.min.js" defer></script><script src="/amigos.js" defer></script></body></html>
