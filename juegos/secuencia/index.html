<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Secuencia — game.hub</title><link rel="icon" href="/favicon.svg?v=3" type="image/svg+xml"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="manifest" href="/manifest.webmanifest"><meta name="apple-mobile-web-app-title" content="game.hub"><link rel="stylesheet" href="/estilo.css"><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{background:#fff;color:#15171C}main{max-width:720px;margin:80px auto 32px;padding:0 16px;user-select:none;-webkit-user-select:none}h1{font-size:clamp(36px,8vw,58px);letter-spacing:-.04em;margin:0}p{line-height:1.5}button{font:inherit;touch-action:none}.meta{display:flex;justify-content:space-between;gap:12px;align-items:center;font-weight:800;margin:16px 0}#estado{min-height:26px}#tablero{display:grid;grid-template-columns:repeat(var(--lado,3),1fr);gap:9px;max-width:450px;margin:auto;touch-action:none}.baldosa{aspect-ratio:1;border:2px solid #15171C;border-radius:12px;background:var(--color);color:#15171C;font-weight:900;font-size:clamp(18px,5vw,28px);display:grid;place-items:center;cursor:pointer;position:relative}.baldosa span{background:#fff;border:2px solid #15171C;border-radius:50%;width:1.65em;height:1.65em;display:grid;place-items:center}.baldosa:disabled{opacity:1;cursor:default}.baldosa.luz{background:#fff;outline:4px solid #15171C;outline-offset:-7px}.baldosa.luz span{background:#F5B700}.baldosa:focus-visible{outline:4px solid #15171C}#nivel{font-size:24px;color:#6C4BD8}#sonido{border:2px solid #15171C;background:#F5B700;border-radius:10px;padding:8px 12px;touch-action:manipulation}@media(max-height:740px){#tablero{max-width:330px}.meta{margin:8px 0}main{margin-top:65px}}</style></head><body><a class="volver" href="/">← game.hub</a><main><h1>Secuencia</h1><p>Mira, recuerda y repite. Cada ronda suma un paso. En el nivel 6, el tablero crece a 4 × 4 y acelera. Tu marca cuenta los niveles completados.</p><div id="carrera"></div><div class="meta"><span id="nivel">Nivel 0</span><button id="sonido" type="button" aria-pressed="false">Sonido: no</button></div><p id="estado" role="status">Pulsa Empezar y prepara tu memoria.</p><div id="tablero" aria-label="Tablero de memoria"></div></main><script src="/carrera.js"></script><script>
'use strict';

// Efectos locales: solo presentación; no consumen el azar de Carrera.
const jugo={
 audio:null,
 nota(f=660,n=1){try{if(window.GameHubFx?.silencio?.()||localStorage.getItem('gamehubSilencio')==='1')return;const A=window.AudioContext||window.webkitAudioContext;if(!A)return;const a=this.audio||(this.audio=new A());a.resume().catch(()=>{});for(let i=0;i<n;i++){const t=a.currentTime+i*.065,o=a.createOscillator(),g=a.createGain();o.type='triangle';o.frequency.value=f*Math.pow(1.25,i);g.gain.setValueAtTime(.035,t);g.gain.exponentialRampToValueAtTime(.001,t+.12);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+.13)}}catch{}},
 mover(el,mal=false){el?.animate(mal?[{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'translateX(0)'}]:[{transform:'scale(.94)'},{transform:'scale(1.04)'},{transform:'scale(1)'}],{duration:280})},
 flotar(el,txt,color='#1E9E6A'){if(!el)return;const r=el.getBoundingClientRect(),p=document.createElement('span');p.textContent=txt;Object.assign(p.style,{position:'fixed',left:Math.max(8,Math.min(innerWidth-85,r.left+r.width/2-30))+'px',top:Math.max(10,r.top)+'px',font:'900 24px system-ui',color,pointerEvents:'none',zIndex:100});document.body.append(p);p.animate([{opacity:1,transform:'translateY(0)'},{opacity:0,transform:'translateY(-65px)'}],{duration:750}).onfinish=()=>p.remove()},
 chispas(el,color='#F5B700',n=12){if(!el)return;const r=el.getBoundingClientRect(),capa=document.createElement('div');Object.assign(capa.style,{position:'fixed',inset:'0',overflow:'hidden',pointerEvents:'none',zIndex:99});document.body.append(capa);setTimeout(()=>capa.remove(),650);for(let i=0;i<n;i++){const p=document.createElement('i');Object.assign(p.style,{position:'fixed',left:(r.left+r.width/2)+'px',top:(r.top+r.height/2)+'px',width:'6px',height:'6px',borderRadius:'2px',background:color,pointerEvents:'none',zIndex:99});capa.append(p);const a=i/n*Math.PI*2;p.animate([{opacity:1,transform:'translate(0,0)'},{opacity:0,transform:`translate(${Math.cos(a)*55}px,${Math.sin(a)*55}px)`}],{duration:550}).onfinish=()=>p.remove()}},
 numero(el,v,suf=''){const t=performance.now();function f(now){if(!el.isConnected)return;const q=Math.min(1,(now-t)/400);el.textContent=Math.round(v*(1-Math.pow(1-q,3)))+suf;if(q<1)requestAnimationFrame(f)}requestAnimationFrame(f)}
};

const tablero=document.querySelector('#tablero'),estado=document.querySelector('#estado'),nivelEl=document.querySelector('#nivel'),sonido=document.querySelector('#sonido');
const colores=['#2D6CDF','#F5B700','#E63946','#1E9E6A','#6C4BD8','#F28C28','#0FA3B1'];
let nivel=0,alcanzado=0,lado=3,secuencia=[],planes=[],entrada=0,acepta=false,version=0,audio=null,mudo=true;
sonido.addEventListener('click',()=>{mudo=!mudo;sonido.textContent='Sonido: '+(mudo?'no':'sí');sonido.setAttribute('aria-pressed',String(!mudo));if(!mudo){const Audio=window.AudioContext||window.webkitAudioContext;if(Audio&&!audio)audio=new Audio();if(audio)audio.resume().catch(()=>{})}});
function nota(i){if(mudo||!audio)return;const t=audio.currentTime,o=audio.createOscillator(),g=audio.createGain();o.frequency.value=220*Math.pow(2,i/12);g.gain.setValueAtTime(.045,t);g.gain.exponentialRampToValueAtTime(.001,t+.14);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+.15)}
function bloquear(){acepta=false;tablero.querySelectorAll('button').forEach(b=>{b.disabled=true;b.classList.remove('luz')})}
function construir(){tablero.replaceChildren();tablero.style.setProperty('--lado',lado);for(let i=0;i<lado*lado;i++){const b=document.createElement('button');b.type='button';b.className='baldosa';b.style.setProperty('--color',colores[i%colores.length]);b.innerHTML='';b.setAttribute('aria-label','Baldosa '+(i+1));b.disabled=true;
 b.addEventListener('pointerdown',e=>{e.preventDefault();if(e.button<=0)tocar(i)});b.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();if(!e.repeat)tocar(i)}});tablero.append(b)}}
const pausa=ms=>new Promise(resolve=>setTimeout(resolve,ms));
async function mostrar(){const token=++version;bloquear();nivel++;lado=nivel>=6?4:3;secuencia=planes[nivel-1];construir();nivelEl.textContent='Nivel '+nivel;estado.textContent=nivel===6?'¡Tablero ampliado! Mira: ahora va más rápido.':'Mira y memoriza…';
 await pausa(650);if(token!==version||!c.jugando)return;
 for(const i of secuencia){const b=tablero.children[i];b.classList.add('luz');nota(i);await pausa(nivel>=6?260:430);if(token!==version||!c.jugando)return;b.classList.remove('luz');await pausa(nivel>=6?120:180);if(token!==version||!c.jugando)return}
 entrada=0;acepta=true;tablero.querySelectorAll('button').forEach(b=>b.disabled=false);estado.textContent='Tu turno: 0 de '+secuencia.length;
}
function terminar(mensaje){version++;bloquear();estado.textContent=mensaje+' Llegaste al nivel '+alcanzado+'.';c.terminar(alcanzado)}
function tocar(i){if(!acepta||!c.jugando)return;nota(i);if(i!==secuencia[entrada]){const correcta=secuencia[entrada];jugo.mover(tablero,true);jugo.nota(130);terminar('¡Esa no era! Mira la baldosa correcta.');tablero.children[correcta]?.classList.add('luz');return}
 const b=tablero.children[i],token=version;b.classList.add('luz');setTimeout(()=>{if(token===version)b.classList.remove('luz')},140);entrada++;estado.textContent='Tu turno: '+entrada+' de '+secuencia.length;
 if(entrada===secuencia.length){alcanzado=nivel;c.progreso(alcanzado,20);bloquear();b.classList.add('luz');setTimeout(()=>{if(token===version)b.classList.remove('luz')},300);estado.textContent='¡Perfecta! Nivel '+nivel+' superado';jugo.flotar(tablero,'¡Perfecta!','#6C4BD8');jugo.nota(660,3);setTimeout(()=>{if(token===version&&c.jugando)mostrar()},550)}
}
const c=Carrera({app:'secuencia',maxValor:100,el:document.querySelector('#carrera'),limite:120000,mejor:'alto',formato:v=>'nivel '+v,vivo:v=>'nivel '+v,
 alEmpezar(rand){version++;nivel=0;alcanzado=0;planes=[];let s=[];for(let n=1;n<=100;n++){if(n===6)s=s.map(i=>Math.floor(i/3)*4+i%3);s=[...s,Math.floor(rand()*(n>=6?16:9))];planes.push(s)}c.progreso(0,20);mostrar()},
 alAcabarTiempo(){terminar('¡Tiempo!')},alCerrar(){version++;bloquear();estado.textContent='Partida cerrada. Completaste '+alcanzado+' niveles.'}
});construir();
</script><script src="/lib/peerjs.min.js" defer></script><script src="/amigos.js" defer></script></body></html>
